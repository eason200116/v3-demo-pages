<header>
  <h1>推广数据链路：从广告接入到报表</h1>
  <p class="lead">按 demo 当前版本（11-04）和已定规则整理。整条链路只认一个编号：<b class="mono">渠道 code</b>，格式是「平台缩写_端_地区_序号」：投广告的如 <span class="mono">FB_WEB_IN_001</span>，代理的如 <span class="mono">agt_WEB_IN_001</span>，商户自己建、不接广告平台的如 <span class="mono">self_WEB_IN_001</span>。前缀：FB / TT / KW（投广告的平台）、agt（代理）、self（商户自建）；端 WEB / PWA / APK / SHELL，地区先用 IN。它在建渠道时生成，跟着链接、落地页、安装包一路带到用户身上，回传和报表都按它算。</p>
  <div class="key">
    <span><b>1 : 1</b> 一个对一个</span>
    <span><b>1 : N</b> 左边一个对右边多个</span>
    <span><b>N : 1</b> 左边多个共用右边一个</span>
    <span>虚线框 = 公共池，多个渠道共用</span>
  </div>
</header>

er{right:-20px}.journey-parallel .journey-node,.relation-grid .journey-node{padding:12px 7px}.journey-figure .report-example{margin-top:18px}.journey-figure .example-heading{align-items:start}.journey-figure .example-heading h3{font-size:16px}@media(max-width:1050px){.journey-parallel,.relation-grid{grid-template-columns:minmax(0,1fr)}.journey-node h4{font-size:15px}.journey-node{padding:12px 8px}.journey-figure{padding:16px}}@media(max-width:750px){.journey-line,.journey-parallel .journey-line,.relation-grid .journey-line{grid-template-columns:minmax(0,1fr);gap:24px}.journey-node{min-height:78px;padding:12px 14px}.journey-node:not(:last-child):after,.journey-parallel .journey-node:not(:last-child):after,.relation-grid .journey-node:not(:last-child):after{content:'↓';top:auto;bottom:-25px;right:auto;left:50%;transform:translateX(-50%)}.journey-notes{grid-template-columns:minmax(0,1fr);gap:14px}.journey-node h4{font-size:16px}.journey-figure{padding:14px}.carrier-branch>h3{font-size:18px}}@media print{.journey-figure,.carrier-branch{break-inside:auto}.journey-line,.journey-parallel .journey-line,.relation-grid .journey-line{grid-template-columns:repeat(var(--journey-count),minmax(0,1fr));gap:22px}.journey-node:not(:last-child):after,.journey-parallel .journey-node:not(:last-child):after,.relation-grid .journey-node:not(:last-child):after{content:'→';left:auto;right:-20px;top:50%;bottom:auto;transform:translateY(-50%)}.journey-node{min-height:90px}}</style><div class="plan"><div class="wrap"><header><b>V3 · 推广落地方案</b><button class="print" id="print" type="button">打印 / 存为 PDF</button></header><h1>推广7个页面</h1><p class="lead">先准备承载用户的载体，再做好入口、分渠道推广、接通广告、记录行为、呈现数据，最后维护APP版本；按下面7步推进。</p><p class="scope">商户端6类页面，加总控「应用与版本」；推广报表两端合并介绍，入口与权限仍分开。新增选择获权商户，编辑锁定归属，关联选项与记录保持同一商户范围。</p><nav class="route" aria-label="落地步骤"><button data-step="plan-01">01 载体准备</button><button data-step="plan-02">02 用户入口</button><button data-step="plan-03">03 分渠道推广</button><button data-step="plan-04">04 广告平台</button><button data-step="plan-05">05 用户行为</button><button data-step="plan-06">06 数据呈现</button><button data-step="plan-07">07 APP版本</button></nav><main><section class="step" id="plan-01" aria-labelledby="title-01"><span class="number">01</span><h2 id="title-01"><button type="button" class="step-toggle" data-reading-title="0" aria-expanded="true" aria-controls="plan-content-01">准备承载用户的载体—APP包和WEB、PWA域名</button></h2><div class="step-content" id="plan-content-01"><p class="purpose">域名和APP包是两条可并行的准备线，不要求先做完域名才能准备APP；App也可能需要下载入口域名。</p><div class="paths"><a href="#mDom" data-page="mDom">商户端 → 域名管理</a><a href="#aApp" data-page="aApp" data-tab="0">总控 → 推广管理 → 应用与版本 → 母包</a></div><ol class="journey-actions"><li>选同一商户，按用户使用的载体分别准备域名和APP母包，两条准备线可以并行。</li><li>域名选择已确认的三种类型，保存后按NS/DNS指引配置解析，查看自动检测结果。</li><li>APP上传对应设备端安装包；改版须更大、换包并核对包内版本，启停与发布分别设置；更新类型支持强制、建议和静默更新。</li><li>Web/PWA不用打APK；核对入口可用与母包可选，不把准备完成当成已投放或用户已更新。</li></ol><div class="carrier-branch"><h3>WEB、PWA域名</h3><p>提供网站、页面入口，也可支撑App下载。</p><figure class="diagram domain-diagram"><figcaption>域名从登记到可用</figcaption>
<div class="domain-main-line" aria-label="登记到可访问的五步主线"><div class="domain-main-node"><span class="domain-main-role">运营 · B端</span><h3>登记配置</h3><p>选择商户与类型</p></div><i class="domain-main-arrow" aria-hidden="true">→</i><div class="domain-main-node"><span class="domain-main-role">后端 · 保存</span><h3>保存并获取<br>解析指引</h3><p>校验配置后返回</p></div><i class="domain-main-arrow" aria-hidden="true">→</i><div class="domain-main-node"><span class="domain-main-role">运营 · 服务商</span><h3>配置解析</h3><p>修改NS / DNS</p></div><i class="domain-main-arrow" aria-hidden="true">→</i><div class="domain-main-node"><span class="domain-main-role">后端 · 自动</span><h3>自动检测</h3><p>检查解析与访问</p></div><i class="domain-main-arrow" aria-hidden="true">→</i><div class="domain-main-node"><span class="domain-main-role">检测结果</span><h3>可访问</h3><p>显示已生效</p></div></div>
<p class="domain-failure-line"><strong>无法访问</strong> → 查看原因 → 修正配置 → 重新检测</p><p class="domain-failure-owner">运营按原因修正域名或解析，后端继续自动检测。</p>
<div class="domain-setup-details"><h3>登记配置：三种类型分别填写什么</h3><div class="domain-setup-grid"><div class="domain-type-detail"><h4>主域名</h4><p>域名、版面配置</p></div><div class="domain-type-detail"><h4>推广域名</h4><p>域名、已有渠道绑定、落地指向表</p></div><div class="domain-type-detail"><h4>PWA防封域名</h4><p>域名、对应PWA页面</p></div></div><p class="domain-setup-note">公共字段：商户、状态、备注。新增选择获权商户，编辑锁定所属。</p><p class="domain-setup-note">渠道未建立时，落地指向表显示暂无；完成03后回到域名编辑，为已关联渠道配置落地指向。</p></div>
<p class="domain-final-note">可访问表示域名检测通过，渠道投放与广告配置继续按03–04处理。</p>
</figure></div><div class="carrier-branch"><h3>APP母包与可用版本</h3><p>提供安卓渠道生成APP包所需的安装包。</p><figure class="journey-figure"><figcaption>APP母包与可用版本：与域名并行准备</figcaption><div class="journey-line" style="--journey-count:4"><div class="journey-node"><h4>选择商户与设备端</h4><p>安卓原生 / 安卓壳包</p></div><div class="journey-node"><h4>上传安装包</h4><p>版本号必填；改版须更大并换包</p></div><div class="journey-node"><h4>核对包内版本</h4><p>与填写值一致才保存当前记录</p></div><div class="journey-node"><h4>启用并发布</h4><p>供对应商户、对应端新打包</p></div></div><div class="journey-notes"><div><strong>两套状态</strong><p>启用/停用决定能否新打包；发布/下架决定商户能否选用。</p></div><div><strong>不等于用户已更新</strong><p>母包保存或发布不自动改变旧APP包，也不改变用户已安装版本。</p></div><div><strong>不一致怎么办</strong><p>版本未增大、未换包或包内版本不符，修正后再提交；不覆盖原可用记录。</p></div></div></figure></div><div class="build"><div><b>前端需实现</b><ul><li><strong class="work-title">商户归属与关联</strong><span class="work-copy">B端新增选择有权限的商户，编辑锁定原归属；域名、页面和渠道按同一商户范围关联；母包由平台公用管理，商户只使用已获下发的版本。</span></li><li><strong class="work-title">域名配置与反馈</strong><span class="work-copy">B端按主域名、推广域名、PWA防封域名展示对应字段，保留版面及已有渠道落地配置；保存后给解析指引，列表区分检测中、已生效和无法访问。</span></li><li><strong class="work-title">母包资料</strong><span class="work-copy">B端填写母包名称、设备类型、<b>必填版本号</b>、更新类型和说明；更新方式固定为安装包升级，一母包维护一条当前记录。</span></li><li><strong class="work-title">换包与版本核对</strong><span class="work-copy">修改版本号时要求<b>版本更大且更换安装包</b>，展示文件名和包内版本核对结果；不符合时指出原因并阻止提交，只改名称等资料可正常保存。</span></li><li><strong class="work-title">启停与发布</strong><span class="work-copy">B端分别展示母包启用/停用、发布/下架；明确新打包资格与商户选用资格，已发旧包不随开关自动改变；静默更新表示后台下载并安装，不干预、不打断用户当前操作。</span></li><li><strong class="work-title">C端入口与实际版本</strong><span class="work-copy">Web/PWA通过域名进入页面，<b>不打APK</b>；App也可能使用下载入口域名，并读取包内渠道和实际版本上报，跳转中保留已有来源。</span></li></ul></div><div><b>后端需实现</b><ul><li><strong class="work-title">提交校验</strong><span class="work-copy">域名接收商户、类型及对应字段，校验归属且编辑锁定商户；公用母包接收设备类型、版本、文件和更新资料，发布时另行选择获发商户。</span></li><li><strong class="work-title">域名关系与检测</strong><span class="work-copy">保存商户、域名用途、渠道和版面关系；检测解析、连接与访问，更新能否访问状态。失败返回原因，保留配置供运营修正后自动重检。</span></li><li><strong class="work-title">版本和文件校验</strong><span class="work-copy">版本按<b>逐段数字比较</b>；改版必须高于原版并换包，同时校验包内版本与填写值一致，失败不覆盖当前记录。</span></li><li><strong class="work-title">当前记录与状态</strong><span class="work-copy">保存当前母包文件、版本和更新资料，分别保存启停和发布状态；不把保存母包当成已发布、已分发或用户已安装。</span></li><li><strong class="work-title">可用旧包依据</strong><span class="work-copy">保留同商户、同设备端实际存在的上一已发布包供回滚；连续保存未发布版本不覆盖该依据，不把未发布版本当回滚目标。</span></li></ul></div></div><p class="result"><b>完成结果</b>域名能按商户查到配置与检测结果；APP改版未增大、未换包或包内不一致不能保存。合格母包启用且发布后可供对应端新打包，旧包与用户实际版本不自动改变。</p></div></section>
<section class="step" id="plan-02" aria-labelledby="title-02"><span class="number">02</span><h2 id="title-02"><button type="button" class="step-toggle" data-reading-title="1" aria-expanded="true" aria-controls="plan-content-02">准备用户先看到的入口</button></h2><div class="step-content" id="plan-content-02"><p class="purpose">先做好落地页，让用户打开渠道链接后看到正确页面，再进入网站或安装引导。</p><div class="paths"><a href="#mLp" data-page="mLp">商户端 → 落地页/PWA管理</a></div><ol class="journey-actions"><li>选商户和PWA/广告图类型，填写对应内容与素材。</li><li>切换语言核对预览，补齐默认语言和已填写语言的缺项。</li><li>保存页面；渠道建立后，在域名编辑中为已关联渠道选择落地页或主站。</li></ol><figure class="journey-figure"><figcaption>把页面内容做成可被渠道选用的入口</figcaption><div class="journey-line" style="--journey-count:4"><div class="journey-node"><h4>选商户与页面类型</h4><p>PWA安装页 / 广告图页</p></div><div class="journey-node"><h4>配置语言与素材</h4><p>填写对应内容，上传页面素材</p></div><div class="journey-node"><h4>预览并保存</h4><p>核对各语言与必填内容</p></div><div class="journey-node"><h4>渠道选用</h4><p>建立渠道后配置落地指向</p></div></div><div class="journey-notes"><div><strong>PWA</strong><p>应用名称、图标、介绍与图片，形成安装页和引导。</p></div><div><strong>广告图</strong><p>主图、宣传文案、按钮、页面标题和隐私政策链接。</p></div><div><strong>缺项或错误</strong><p>回到对应字段或语言修正；保存失败不覆盖原可用页面。</p></div></div></figure><div class="build"><div><b>前端需实现</b><ul><li><strong class="work-title">商户与类型</strong><span class="work-copy"><span class="work-role">B端：</span>新增先选商户，编辑锁定归属；按PWA或广告图展示对应字段，绑定域名<b>只列本商户可选域名</b>。</span></li><li><strong class="work-title">页面素材</strong><span class="work-copy"><span class="work-role">B端：</span>PWA编辑应用名称、图标、介绍和图片等；广告图编辑主图、宣传文案、按钮、页面标题及隐私政策链接。</span></li><li><strong class="work-title">语言与预览</strong><span class="work-copy"><span class="work-role">B端：</span>切换语言时保留各语言内容，预览跟随当前配置更新；提交前指出必填或未完成的语言内容，不能只提示保存失败。</span></li><li><strong class="work-title">用户端展示</strong><span class="work-copy"><span class="work-role">C端：</span>Web按保存内容展示广告图页面，PWA展示安装页与引导；从渠道进入页面和继续跳转时保留原有来源信息。</span></li></ul></div><div><b>后端需实现</b><ul><li><strong class="work-title">字段校验</strong><span class="work-copy">校验商户归属、页面类型及对应必填字段，校验默认语言和已填写语言的完整性；失败返回具体缺项。</span></li><li><strong class="work-title">页面存储</strong><span class="work-copy">保存页面路径、语言内容和素材之间的对应关系，按所属商户读取；编辑更新原页面，不能误新增或转移归属。</span></li><li><strong class="work-title">关联选项</strong><span class="work-copy">保存本商户域名与页面关联，并为渠道选用提供同商户、匹配页面类型的候选项。</span></li><li><strong class="work-title">失败反馈</strong><span class="work-copy">按页面及语言提供展示内容；素材或内容校验失败不覆盖原可用配置，返回能让B端定位的错误。</span></li></ul></div></div><p class="result"><b>完成结果</b>验收时，各语言预览与保存内容一致，缺项能定位；编辑后仍是原页面，本商户渠道可选用，其他商户不会看到该页面。</p></div></section>
<section class="step" id="plan-03" aria-labelledby="title-03"><span class="number">03</span><h2 id="title-03"><button type="button" class="step-toggle" data-reading-title="2" aria-expanded="true" aria-controls="plan-content-03">按渠道分发推广入口</button></h2><div class="step-content" id="plan-content-03"><p class="purpose">商户拥有渠道，代理通过所绑渠道推广；入口来源与注册最终代理归属分别保存。</p><div class="paths"><a href="#mCh" data-page="mCh">商户端 → 渠道管理</a><a href="#mApp" data-page="mApp" data-tab="1">商户端 → 应用与版本 → 自动打包</a><a href="#mDom" data-page="mDom">商户端 → 域名管理 → 编辑</a></div><ol class="journey-actions"><li>选当前商户，为官方或代理建立渠道；一个代理可有多个渠道，官方渠道不挂代理。</li><li>确定每个渠道的设备类型、推广入口和广告配置；Web/PWA取得链接，安卓按母包前置条件自动创建打包任务。</li><li>用户经分享入口注册，邀请码可不填也可填写；填写有效邀请码以其代理为准，未填以可信渠道代理标识为准。</li><li>核对渠道来源和用户最终代理；来源不被邀请码覆盖，直属归属与上级团队统计分开看。</li></ol><figure class="journey-figure"><figcaption>先分清所有权和代理关系，再看入口如何分发</figcaption><div class="relation-grid"><div class="relation-panel"><h4>代理有上下级</h4><div class="journey-line" style="--journey-count:3"><div class="journey-node"><h4>1级代理</h4><p>层级示意</p></div><div class="journey-node"><h4>2级代理</h4><p>层级示意</p></div><div class="journey-node"><h4>下级代理</h4><p>可继续有下级</p></div></div><p>代理渠道只关联当前商户最顶级的一级代理；官方渠道不挂代理。</p></div><div class="relation-panel"><h4>渠道属于商户</h4><div class="journey-line" style="--journey-count:2"><div class="journey-node"><h4>商户daman</h4><p>拥有渠道</p></div><div class="journey-node"><h4>A1 / A2 / 官方渠道</h4><p>与代理归属是不同关系</p></div></div><p>集团、商户不是代理层级；关联范围限当前商户。</p></div></div><div class="journey-parallel"><div class="journey-lane"><h4 class="journey-lane-title">代理渠道</h4><div class="association"><strong>代理8810021</strong><span>→</span><strong>A1、A2两个渠道</strong></div><p>一个代理可有多个渠道；每个代理渠道只绑定一个代理，不指定该示例ID的实际等级。</p></div><div class="journey-lane"><h4 class="journey-lane-title">官方渠道</h4><div class="association"><strong>商户官方渠道</strong><span>→</span><strong>不挂代理</strong></div><p>官方渠道仍有渠道来源；未填邀请码时不强行绑定代理。</p></div></div><h4 class="journey-subhead">每个渠道确定设备、推广入口和广告配置</h4><div class="journey-parallel"><div class="journey-lane"><h4 class="journey-lane-title">Web / PWA</h4><div class="journey-line" style="--journey-count:2"><div class="journey-node"><h4>生成推广链接</h4><p>带渠道来源</p></div><div class="journey-node"><h4>用户打开入口</h4><p>保留来源到注册</p></div></div></div><div class="journey-lane"><h4 class="journey-lane-title">安卓原生 / 壳包</h4><div class="journey-line" style="--journey-count:3"><div class="journey-node"><h4>保存前校验母包</h4><p>该商户已获发、对应端最新已发布且启用</p></div><div class="journey-node"><h4>保存后自动入队</h4><p>新增一次只发一个任务</p></div><div class="journey-node"><h4>成功APP包</h4><p>成功才替换；失败保留旧包</p></div></div></div></div><h4 class="journey-subhead">注册时，渠道来源和用户代理分别确认</h4><div class="journey-line" style="--journey-count:4"><div class="journey-node"><h4>经渠道入口进入</h4><p>Web/PWA保留链接；App读取渠道与版本</p></div><div class="journey-node"><h4>注册提交</h4><p>来源证据＋可选邀请码</p></div><div class="journey-node"><h4>后端校验</h4><p>同商户、有效性与可信来源</p></div><div class="journey-node"><h4>分别记录</h4><p>渠道来源 / 用户最终代理</p></div></div><div class="journey-parallel"><div class="journey-lane"><h4 class="journey-lane-title">未填写邀请码</h4><p>可信渠道已绑定代理 → 使用该代理；官方渠道无代理时不强绑。</p></div><div class="journey-lane"><h4 class="journey-lane-title">填写有效邀请码</h4><p>以邀请码代理为准。例如渠道A1进入、填代理B邀请码：<b>渠道来源仍A1，用户归属代理B</b>。</p></div></div><p class="journey-warning">邀请码须有效且属于当前商户；无效或跨商户时明确报错，不静默改分其他代理。此处确认注册归属，不增加注册后改绑功能。</p><p class="journey-warning">直属代理归属与上级团队汇总分别核对，同一用户不能把各层人数相加；没有代理或未归因不等于自然量。</p></figure><div class="build"><div><b>前端需实现</b><ul><li><strong class="work-title">B端渠道表单</strong><span class="work-copy">选择商户、官方/代理渠道及设备类型；代理渠道选择当前商户最顶级的一级代理，编辑锁定原商户及不可变字段。</span></li><li><strong class="work-title">B端关联与任务</strong><span class="work-copy">分组、广告配置、页面和母包候选按同商户、设备收窄；保存后显示链接或打包任务，能查进度和失败原因，编辑保存不重复入队。</span></li><li><strong class="work-title">C端Web/PWA来源</strong><span class="work-copy">从带代理的分享入口进入时，保留链接来源到页面跳转与注册；<b>邀请码选填</b>，未填也能按可信渠道证据确认代理归属。</span></li><li><strong class="work-title">C端App证据</strong><span class="work-copy">读取包内渠道、实际版本和可用入口来源，注册时提交来源证据；不由客户端任意指定生效代理。</span></li><li><strong class="work-title">注册校验反馈</strong><span class="work-copy">填写邀请码时和来源证据一起提交，按后端结果反馈；无效或跨商户时让用户修正，不静默替换代理或覆盖渠道来源。</span></li></ul></div><div><b>后端需实现</b><ul><li><strong class="work-title">渠道关系校验</strong><span class="work-copy">校验商户和关联对象，代理渠道关联当前商户内一个代理，官方渠道不挂代理；一个代理可关联多个渠道。</span></li><li><strong class="work-title">保存与入口生成</strong><span class="work-copy">保存商户所有权、渠道所绑代理、设备、页面及广告配置关系，生成渠道标识与推广链接；渠道所属商户不能通过编辑更换。</span></li><li><strong class="work-title">安卓打包前置</strong><span class="work-copy">查该商户已获发、对应端最新已发布且启用母包；无可用包则渠道和任务都不创建。符合条件的新增渠道只提交一个任务，成功前保留旧APP包。</span></li><li><strong class="work-title">注册代理优先级</strong><span class="work-copy"><b>填写有效邀请码以邀请码代理为准，未填以可信渠道的代理标识为准</b>；校验有效性及同商户范围，拒绝无效、跨商户证据，不静默回退分配。</span></li><li><strong class="work-title">来源与归属分别留存</strong><span class="work-copy">即使邀请码代理B不同于渠道所绑代理A，也保留渠道来源A与用户最终代理B；官方无代理可为空，直属归属和上级团队汇总不能混为同一计数。</span></li></ul></div></div><p class="result"><b>完成结果</b>A1和A2可同绑代理8810021，官方渠道无代理。未填邀请码按可信渠道代理确认；填同商户有效B邀请码则来源仍A1、用户归属B。无效或跨商户不静默重分配，安卓新增只产生一个对应任务。</p></div></section>
<section class="step" id="plan-04" aria-labelledby="title-04"><span class="number">04</span><h2 id="title-04"><button type="button" class="step-toggle" data-reading-title="3" aria-expanded="true" aria-controls="plan-content-04">接通广告平台</button></h2><div class="step-content" id="plan-content-04"><p class="purpose">渠道已有入口后，再配置对应广告平台及投放端，让实际事件有明确的回传去向。</p><div class="paths"><a href="#mPromo" data-page="mPromo" data-tab="0">商户端 → 推广配置 → 广告平台配置</a></div><ol class="journey-actions"><li>选已有渠道、广告平台和投放端，核对一份配置只对应一个渠道。</li><li>Web端覆盖Web/PWA，APP端覆盖安卓原生/壳包；按平台填写接入资料，Adjust仅App Token及选用业务事件各自的Event Token。</li><li>通过该渠道入口测试，区分我方已发出、平台已接收与失败原因。</li></ol><figure class="journey-figure"><figcaption>按已有渠道的设备与平台建立接入</figcaption><div class="journey-line" style="--journey-count:4"><div class="journey-node"><h4>选择既有渠道</h4><p>同商户，一个配置对应一个渠道</p></div><div class="journey-node"><h4>选择平台与投放端</h4><p>匹配渠道设备</p></div><div class="journey-node"><h4>填写接入资料</h4><p>Adjust按业务事件配置Token；其他平台按原凭证</p></div><div class="journey-node"><h4>校验与测试</h4><p>区分发出、接收和失败</p></div></div><div class="journey-notes"><div><strong>提供给接入端</strong><p>Pixel ID/App ID等公共标识可用于相应Web/App初始化。</p></div><div><strong>仅服务端保管</strong><p>Access Token等密钥不能带到用户端。</p></div><div><strong>按只读清单处理</strong><p>各平台清单不同，不把所有事件称为标准事件，不追加提现回传。</p></div></div><p class="journey-warning">关联或投放端不匹配 → 修正配置；未接收或失败 → 留下原因，再用对应渠道入口核对。</p></figure><div class="build"><div><b>前端需实现</b><ul><li><strong class="work-title">配置表单</strong><span class="work-copy"><span class="work-role">B端：</span>选择商户、平台和Web端/APP端；Adjust填写App Token及选用业务事件各自的Event Token，其他平台保留各自凭证；关联未被其他配置占用的适配渠道；编辑保持原归属，显示实际绑定对象。</span></li><li><strong class="work-title">只读事件</strong><span class="work-copy"><span class="work-role">B端：</span>只读展示该平台、该投放端的中文事件、平台事件及触发说明；Adjust未填Event Token的事件不纳入该配置，不允许自行把事件改成其他含义，也不把所有事件称为标准事件。</span></li><li><strong class="work-title">标识与密钥</strong><span class="work-copy"><span class="work-role">C端：</span>Web与App按对应接入方式取得所需公共标识和事件配置；<b>Pixel ID/App ID</b>等可用于初始化，<b>Access Token</b>等服务端密钥不得带到接入端。</span></li><li><strong class="work-title">测试反馈</strong><span class="work-copy"><span class="work-role">B端：</span>测试展示所选渠道、我方记录与平台接收结果，失败指出原因；不能把已发出或<b>未取得</b>结果显示成平台已接收。</span></li></ul></div><div><b>后端需实现</b><ul><li><strong class="work-title">绑定校验</strong><span class="work-copy">校验商户、平台、投放端和渠道匹配关系；按<b>一份配置对应一个渠道</b>保存，拒绝跨商户关联。</span></li><li><strong class="work-title">凭证分工</strong><span class="work-copy">区分公共接入标识与<b>服务端密钥</b>保存和输出：为相应Web/App提供初始化所需标识，<b>Access Token</b>等密钥仅由服务端使用。</span></li><li><strong class="work-title">事件映射</strong><span class="work-copy">按页面<b>只读事件</b>映射处理对应业务或行为，不自行增加事件；提现只进入内部业务记录，不加入广告回传。</span></li><li><strong class="work-title">回传留底</strong><span class="work-copy">按渠道所绑平台配置处理发送与接收结果，分别保留我方处理记录、平台响应和失败原因，供测试与异常排查。</span></li></ul></div></div><p class="result"><b>完成结果</b>验收时，能从渠道查到唯一对应配置及只读清单；接入端取得所需公共标识但拿不到<strong>服务端密钥</strong>，发出、接收与失败结果能区分。</p></div></section>
<section class="step" id="plan-05" aria-labelledby="title-05"><span class="number">05</span><h2 id="title-05"><button type="button" class="step-toggle" data-reading-title="4" aria-expanded="true" aria-controls="plan-content-05">记录用户行为</button></h2><div class="step-content" id="plan-content-05"><p class="purpose">访问和业务成功分别记录，渠道来源与最终代理分别确认，内部统计与广告回传分别留底。</p><div class="paths"><a href="#mPromo" data-page="mPromo" data-tab="1">商户端 → 推广配置 → 事件记录</a></div><ol class="journey-actions"><li>核对访问、启动等真实行为，不等注册后才开始记录。</li><li>注册/充值由后端分别确认成功或到账，注册时按有效邀请码优先规则确认代理，保留渠道来源。</li><li>将来源与用户、订单关联；同一事实重试不重复计数，提现只记内部业务。</li><li>分别看我方记录和平台接收结果，广告失败不影响内部成功记录。</li></ol><figure class="journey-figure"><figcaption>先记录各自真实事实，再分内部留底与广告回传</figcaption><div class="journey-parallel"><div class="journey-lane"><h4 class="journey-lane-title">浏览 / 启动等行为</h4><div class="journey-line" style="--journey-count:2"><div class="journey-node"><h4>真实发生</h4><p>Web/PWA访问或App运行行为</p></div><div class="journey-node"><h4>行为记录</h4><p>不等待注册或充值</p></div></div></div><div class="journey-lane"><h4 class="journey-lane-title">注册 / 充值业务</h4><div class="journey-line" style="--journey-count:2"><div class="journey-node"><h4>业务处理</h4><p>注册提交、充值处理</p></div><div class="journey-node"><h4>后端确认</h4><p>注册成功 / 充值到账</p></div></div></div></div><div class="journey-line" style="--journey-count:3"><div class="journey-node"><h4>关联来源证据</h4><p>渠道、商户、用户及订单</p></div><div class="journey-node"><h4>注册时确认代理</h4><p>有效邀请码优先，否则可信渠道代理</p></div><div class="journey-node"><h4>同一事实去重</h4><p>重试不重复增加统计</p></div></div><div class="journey-parallel"><div class="journey-lane"><h4 class="journey-lane-title">内部记录与统计</h4><div class="journey-line" style="--journey-count:2"><div class="journey-node"><h4>留内部记录</h4><p>业务与来源关系</p></div><div class="journey-node"><h4>归入对应渠道</h4><p>新用户成功注册去重+1</p></div></div></div><div class="journey-lane"><h4 class="journey-lane-title">广告回传与结果</h4><div class="journey-line" style="--journey-count:2"><div class="journey-node"><h4>按渠道平台配置</h4><p>只处理对应清单事件</p></div><div class="journey-node"><h4>分别留底</h4><p>发送 / 接收 / 失败</p></div></div></div></div><p class="journey-warning">填写B有效邀请码时，保留渠道来源A、最终代理B；广告去向仍按渠道配置。提现只进入内部业务记录，不加入广告回传。广告失败不撤销内部成功记录。</p></figure><div class="build"><div><b>前端需实现</b><ul><li><strong class="work-title">Web/PWA来源</strong><span class="work-copy">保留入口链接来源到页面跳转和注册；邀请码为可选输入，与渠道来源证据一并提交，由后端确认最终代理。</span></li><li><strong class="work-title">App来源与事实</strong><span class="work-copy">读取包内渠道、版本及可用入口证据；浏览、启动与注册/充值结果分开上报，不能把按钮点击当成功，也不能由客户端任意改代理。</span></li><li><strong class="work-title">B端业务记录</strong><span class="work-copy">沿用发生时间、会员、订单、渠道和设备等信息展示我方记录，能查看真实业务结果与关联来源。</span></li><li><strong class="work-title">B端回传反馈</strong><span class="work-copy">展示广告发送、接收和失败结果及可定位原因；无效邀请码或跨商户校验给出明确反馈，不显示成已确认归属。</span></li></ul></div><div><b>后端需实现</b><ul><li><strong class="work-title">分别确认事件事实</strong><span class="work-copy">浏览/启动真实发生即可记录；注册以服务端成功、充值以到账成功为准，不让所有行为等待注册或充值。</span></li><li><strong class="work-title">注册代理与来源</strong><span class="work-copy">有效邀请码代理优先；未填使用可信渠道已绑定代理。校验同商户与有效性，渠道来源独立保留，官方无代理时不强绑。</span></li><li><strong class="work-title">关联用户与订单</strong><span class="work-copy">保存渠道来源、所属商户、用户最终代理及相关业务记录，使统计与明细能分别追溯，不新增注册后改绑功能。</span></li><li><strong class="work-title">同一事实去重</strong><span class="work-copy">同一事实的重复消息或重试不能重复计数；新用户注册成功只增加对应渠道注册人数。</span></li><li><strong class="work-title">两条线分别留底</strong><span class="work-copy">内部行为/业务记录与广告发送、平台响应分开保存；回传按渠道平台配置处理，失败不撤销内部统计。提现仅作内部记录。</span></li></ul></div></div><p class="result"><b>完成结果</b>能在注册前看到真实访问/启动记录；同一注册成功重复回报不重复计数。渠道来源A与邀请码代理B分别可追溯，广告失败不撤销内部记录，提现不进入广告回传。</p></div></section>
<section class="step" id="plan-06" aria-labelledby="title-06"><span class="number">06</span><h2 id="title-06"><button type="button" class="step-toggle" data-reading-title="5" aria-expanded="true" aria-controls="plan-content-06">数据呈现：用户到底记在哪一行</button></h2><div class="step-content" id="plan-content-06"><p class="purpose">通过现有报表字段核对商户、渠道、端和代理，区分内部业务结果与广告平台报告。</p><div class="paths"><a href="#mRpt" data-page="mRpt" data-tab="0">商户端 → 推广报表 → 新增报表</a><a href="#aRpt" data-page="aRpt" data-tab="0">总控 → 推广管理 → 推广报表</a></div><ol class="journey-actions"><li>按商户、渠道、代理及现有日期等筛选核对结果，设备类型作为列表维度查看。</li><li>用未填邀请码的A1示例看注册104→105；若填B有效邀请码，渠道来源仍A1、用户最终代理B。</li><li>分清直属归属和上级团队汇总，不把同一用户各层人数相加。</li><li>曝光、点击取平台授权报告；未授权/未获取不当0，对账核对双方统计日期、时区及延迟。</li></ol><figure class="journey-figure"><figcaption>从同一名用户，核对来源、代理与报表结果</figcaption><div class="journey-line" style="--journey-count:3"><div class="journey-node"><h4>读取真实记录</h4><p>用户、订单与渠道关联</p></div><div class="journey-node"><h4>按商户和渠道查询</h4><p>沿用现有筛选与字段</p></div><div class="journey-node"><h4>呈现结果与明细</h4><p>核对来源和最终代理</p></div></div><div class="report-example" aria-labelledby="report-example-title"><div class="example-heading"><h3 id="report-example-title">数据呈现：这名用户记在哪一行</h3><a href="#mRpt" data-page="mRpt" data-tab="0">打开新增报表 →</a></div><p>示例：1名新用户通过A1注册成功且未填邀请码，“注册”从104变为105；重复回报不再次增加。</p><table class="example-table"><thead><tr><th>商户</th><th>渠道</th><th>设备类型</th><th>归属代理</th><th>注册</th></tr></thead><tbody><tr><td>(1050)daman</td><td>A1<small>agt_WEB_IN_001</small></td><td>Web</td><td>8810021</td><td><strong>104 → 105</strong><small>示例变化：+1</small></td></tr></tbody></table></div><div class="journey-notes"><div><strong>未填邀请码的示例</strong><p>A1所绑代理8810021，注册104→105；同一事实重复回报仍为105。</p></div><div><strong>填B有效邀请码的情况</strong><p>渠道来源仍A1，用户最终代理为B；新增报表按渠道看变化，用户来源明细核对最终代理。</p></div><div><strong>没有代理不是没有来源</strong><p>官方渠道可无代理但仍有渠道来源；未归因也不等于自然量。</p></div></div><div class="journey-parallel"><div class="journey-lane"><h4 class="journey-lane-title">我方业务结果</h4><p>按已确认业务事实与所属关系，查询现有注册、留存、花费及用户来源数据。</p></div><div class="journey-lane"><h4 class="journey-lane-title">平台授权报告</h4><p>曝光、点击等取平台报告；未授权或未取得显示未获取，不补成0，并核对时区、日期和延迟。</p></div></div></figure><div class="build"><div><b>前端需实现</b><ul><li><strong class="work-title">筛选范围</strong><span class="work-copy"><span class="work-role">B端：</span>沿用现有商户、渠道、渠道类型、代理、分组、平台和日期等筛选，查询结果与当前选中商户保持一致。</span></li><li><strong class="work-title">数据维度</strong><span class="work-copy"><span class="work-role">B端：</span>展示商户、渠道、设备类型、归属代理、注册等现有字段，支持查看新增、留存、花费和用户来源，并能从汇总找到对应明细。</span></li><li><strong class="work-title">缺失与零值</strong><span class="work-copy"><span class="work-role">B端：</span>平台曝光、点击等注明其报告来源与授权/获取情况；<b>未授权、未获取和数值0</b>必须分开显示。</span></li><li><strong class="work-title">时间对账</strong><span class="work-copy"><span class="work-role">B端：</span>对账时分别核对我方与平台报告的统计日期、时区和延迟，保留实际取得的时间信息，不把两类结果混成同一来源。</span></li></ul></div><div><b>后端需实现</b><ul><li><strong class="work-title">内部汇总</strong><span class="work-copy">按获权商户与已有筛选条件查询内部记录，按现有字段和统计口径生成渠道结果，保留结果与源记录的对应关系。</span></li><li><strong class="work-title">来源关系</strong><span class="work-copy">从用户、订单与渠道关系读取渠道来源和注册时确认的最终代理，保留邀请码优先的结果；两者不要求相同，重复事实不再次进入统计。</span></li><li><strong class="work-title">平台报告</strong><span class="work-copy">平台授权报告独立取数，保留实际获取情况和对应统计时间；<b>未取得</b>的数据返回未获取，不用0或内部点击数代替。</span></li><li><strong class="work-title">查询一致</strong><span class="work-copy">列表、汇总与明细使用一致商户和查询范围；查询或取数失败返回原因，不能拿其他商户或其他来源的结果补齐。</span></li></ul></div></div><p class="result"><b>完成结果</b>未填邀请码的示例在A1渠道体现注册+1且不重复增加；有效B邀请码只改变本次注册最终代理，不覆盖A1来源。切商户数据隔离，未获取与0可区分，真实报表数据不因示意改变。</p></div></section>
<section class="step" id="plan-07" aria-labelledby="title-07"><span class="number">07</span><h2 id="title-07"><button type="button" class="step-toggle" data-reading-title="6" aria-expanded="true" aria-controls="plan-content-07">维护APP版本，跟进到实际运行</button></h2><div class="step-content" id="plan-content-07"><p class="purpose">母包版本、渠道APP包、分发文件和用户实际运行版本分步核对，不把发布当成全量更新完成。</p><div class="paths"><a href="#mApp" data-page="mApp" data-tab="0">商户端 → 应用与版本 → 版本更新</a><a href="#aApp" data-page="aApp" data-tab="0">总控 → 应用与版本 → 母包</a><a href="#aApp" data-page="aApp" data-tab="1">总控 → 应用与版本 → 自动打包队列</a></div><ol class="journey-actions"><li>更新版本须更大、换安装包并核对包内一致；发布、回滚或下架均二次确认；商户操作只改变本商户获发版本的状态。</li><li>回滚仅用同商户、同设备上一次实际已发布且有可用文件的包，无旧包不允许回滚。</li><li>新增安卓渠道或总控发布下发时发起对应渠道任务；实际开始超过10分钟为超时，失败/超时可重试，成功前保留旧包。</li><li>成功后使用现有APP包下载/分发入口交付新包，核对用户实际运行版本；已安装旧包不会因母包发布自动升级。</li></ol><figure class="journey-figure"><figcaption>先确认可用版本，再跟到用户实际运行</figcaption><div class="journey-parallel"><div class="journey-lane"><h4 class="journey-lane-title">发布新版本</h4><div class="journey-line" style="--journey-count:3"><div class="journey-node"><h4>上传更高版本</h4><p>换新安装包</p></div><div class="journey-node"><h4>包内版本核对</h4><p>与填写值一致才保存</p></div><div class="journey-node"><h4>发布确认</h4><p>取消不改变状态</p></div></div></div><div class="journey-lane"><h4 class="journey-lane-title">回滚可用旧版</h4><div class="journey-line" style="--journey-count:3"><div class="journey-node"><h4>找上一已发布包</h4><p>同商户、同设备端</p></div><div class="journey-node"><h4>核对文件可用</h4><p>无可用旧包不能回滚</p></div><div class="journey-node"><h4>回滚确认</h4><p>不是回到未发布版本</p></div></div></div></div><div class="journey-line" style="--journey-count:4"><div class="journey-node"><h4>更新共用发布状态</h4><p>商户与总控一致</p></div><div class="journey-node"><h4>发起渠道任务</h4><p>下发所选商户的对应端渠道；成功前保留旧包</p></div><div class="journey-node"><h4>更新分发产物</h4><p>使用现有APP包下载/分发入口</p></div><div class="journey-node"><h4>用户实际运行</h4><p>以实际版本回报核对</p></div></div><div class="journey-notes"><div><strong>下架也要确认</strong><p>控制商户能否选择版本，已发旧包及用户已安装版本不自动改变。</p></div><div><strong>失败 / 超时</strong><p>从实际开始计时，超过10分钟标独立超时并保留进度；重试重新排队、重新计时。</p></div><div><strong>什么时候替换</strong><p>新增安卓渠道或总控发布下发时发起对应渠道任务，只对本次所选商户的对应端渠道重打。成功才替换对应渠道APP包，失败、超时或取消不破坏旧成功包。</p></div></div></figure><div class="build"><div><b>前端需实现</b><ul><li><strong class="work-title">页面分工</strong><span class="work-copy"><span class="work-role">B端：</span>商户保留版本更新/自动打包，总控保留母包/自动打包队列；清楚展示当前版本、发布状态和对应任务，不把母包发布当成用户已安装。</span></li><li><strong class="work-title">操作确认</strong><span class="work-copy"><span class="work-role">B端：</span>发布、回滚、下架均<b>二次确认</b>，<b>取消不改变状态</b>；已发布不再显示发布入口，无可用上一已发布包不能回滚，两端展示共用结果。</span></li><li><strong class="work-title">队列反馈</strong><span class="work-copy"><span class="work-role">B端：</span>自动打包只展示自动触发的任务和已成功APP包；队列展示排队、打包中、成功、失败、超时及进度/时间；提供对应取消、日志、重试和查看入口，成功前保留旧APP包展示与下载。</span></li><li><strong class="work-title">实际安装</strong><span class="work-copy"><span class="work-role">C端App：</span>读取并回报实际安装版本；B端分别跟进渠道APP包、分发文件和用户版本，通过现有APP包下载/分发入口交付，用户版本以实际运行回报为准。</span></li></ul></div><div><b>后端需实现</b><ul><li><strong class="work-title">发布与回滚</strong><span class="work-copy">发布/下架更新共用发布状态；回滚只取同商户、同设备端上一次实际已发布且有可用文件的版本，<b>不能退到未发布版本</b>或不存在的旧包。</span></li><li><strong class="work-title">打包校验</strong><span class="work-copy">接收新增安卓渠道、总控批量下发或重试产生的具体渠道任务，校验目标母包仍可用于该商户与设备端，并关联渠道、目标版本和本次任务，不能跨商户读取或替换产物。</span></li><li><strong class="work-title">超时与重试</strong><span class="work-copy">从本次实际开始打包计时，<b>超过10分钟</b>标为独立超时并<b>保留进度与原因</b>；失败/超时重试重新排队，清空旧运行时间和进度。</span></li><li><strong class="work-title">产物与回报</strong><span class="work-copy">只在打包成功后替换对应渠道的APP包，失败、超时或取消不破坏<b>旧成功包</b>；分别保存分发产物与用户实际版本回报。</span></li></ul></div></div><p class="result"><b>完成结果</b>验收时，取消确认无变化，无旧包不允许回滚；<strong>超过10分钟</strong>保留超时进度，重试重新计时，<strong>成功才替换</strong>APP包，用户版本仍以实际回报为准。</p></div></section></main></div></div></template><section id="app">
