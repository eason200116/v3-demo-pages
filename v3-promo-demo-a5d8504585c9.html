<header>
  <h1>推广数据链路：从广告接入到报表</h1>
  <p class="lead">按 demo 当前版本（11-03）和已定规则整理。整条链路只认一个编号：<b class="mono">渠道 code</b>，格式是「平台缩写_端_地区_序号」：投广告的如 <span class="mono">FB_H5_IN_001</span>，主站的 5 个系统渠道如 <span class="mono">off_H5_IN_001</span>，代理的如 <span class="mono">agt_H5_IN_001</span>，商户自己建、不接广告平台的如 <span class="mono">self_H5_IN_001</span>。前缀：FB / TT / KW / GG（投广告的平台）、off（主站）、agt（代理）、self（商户自建）；端 PC / H5 / PWA / APK / SHELL，地区先用 IN。它在建渠道时生成，跟着链接、落地页、安装包一路带到用户身上，回传和报表都按它算。</p>
  <div class="key">
    <span><b>1 : 1</b> 一个对一个</span>
    <span><b>1 : N</b> 左边一个对右边多个</span>
    <span><b>N : 1</b> 左边多个共用右边一个</span>
    <span>虚线框 = 公共池，多个渠道共用</span>
  </div>
</header>

<p class="scope-intro">按下面这棵树分工，后面的 8 个阶段说明具体怎么做。</p>
<div class="scope-columns">
<section aria-labelledby="scope-c" class="scope-side"><h3 id="scope-c">C 端 · 先接好记录能力</h3>
<ul class="scope-tree">
<li><strong>Web · PC、H5、PWA</strong><ul>
<li><b>读取渠道 code</b><span>打开推广链接，读取渠道 code，向服务端取得对应的接入配置。</span></li>
<li><b>记下点击编号</b><span>落地页（或主站入口）记下广告点击编号（如 fbclid、ttclid、gclid）交给服务端；5 个事件都由服务端确认成功后发给平台，没拿到点击编号也照发，带 IP 和 UA，由平台匹配。</span></li>
<li><b>带住来源</b><span>页面跳转、注册时带着访问编号和可用来源；PWA 另查安装后打开是否能接续。</span></li>
<li><b>把记录交给服务端</b><span>记录能关联渠道、用户和订单；重发同一条记录，不能重复计数。</span></li>
</ul></li>
<li><strong>APP · 安卓原生 / 安卓壳</strong><ul>
<li><b>不接广告 SDK</b><span>母包不接广告平台的 SDK，也不接第三方归因工具；<span style="background:#fff3c4;border-radius:3px;padding:0 3px">激活（打开 App）和其余 5 个事件都由服务端确认成功后发给平台，不会和 SDK 重复。</span></span></li><li><b>激活 = 打开 App</b><span><span style="background:#fff3c4;border-radius:3px;padding:0 3px">安卓原生、安卓壳都报；每台设备装好后第一次打开时报一次，服务端按 IP + 机型对上落地页记下的点击编号再发，对不上也照发（带 IP 和 UA）。Web、PWA 不报激活。</span></span></li>
<li><b>安装包读自己的渠道号</b><span>用户下载时服务端把渠道 code 写进母包（不重新签名）；App 运行后读出来交给服务端核对渠道。</span></li>
<li><b>壳包多接一层</b><span>壳内网页只把注册、充值成功结果交给服务端，由服务端发给广告平台，避免重复。</span></li>
<li><b>实测安装后的路径</b><span>从广告到落地页、下载、安装、启动走一遍；来源拿不到就保留未知，不能凭安装包里的渠道号认定具体广告。</span></li>
</ul></li></ul></section>
<section aria-labelledby="scope-b" class="scope-side"><h3 id="scope-b">B 端 · 配置入口、查看结果</h3>
<ul class="scope-tree">
<li id="merchant-scope"><strong>商户端 · 六个页面</strong><ul>
<li><b>广告接入</b><span>原“推广归因配置”，新增独立页面。</span><ul>
<li><b>平台配置 · 接入验证</b><span>在一个列表里选广告平台，选 <span style="background:#fff3c4;border-radius:3px;padding:0 3px">接入端（Web / PWA / App / 壳包，一条只选一种）；不在这里选渠道，配置在「新增渠道」时选，这里只显示被哪个渠道用了</span>，填 Pixel ID（Google 填 Customer ID 并授权）并测试；<span style="background:#fff3c4;border-radius:3px;padding:0 3px">上报事件只展示，商户不用配置（Web、PWA 5 个；App、壳包多一个「激活」，共 6 个）。</span></span></li>
</ul></li>
<li><b>渠道管理</b><span>名称沿用现有页面，在上面扩展。</span><ul>
<li><b>渠道 · 推广链接</b><span><span style="background:#fff3c4;border-radius:3px;padding:0 3px">渠道只分代理渠道和非代理渠道，另有 5 个系统自带的「主站」渠道，<span style="background:#fff3c4;border-radius:3px;padding:0 3px">按端各一个：主站 · PC、H5、PWA、安卓原生、安卓壳</span>（直接打开主站、装主站的 PWA 或下载主站的包，没带渠道 code 的按实际的端记到对应的那个；不能删、不挂代理、不发平台）；<span style="background:#fff3c4;border-radius:3px;padding:0 3px">渠道停用后，推广链接打开直接到主站首页，不再给广告平台发事件（要不要同时禁止这个渠道的用户登录，待定）</span>；<span style="background:#fff3c4;border-radius:3px;padding:0 3px">广告接入配置可选「不接广告平台」（群发链接、自己推广），不标红；落地指向主站首页或注册页时，可设分享卡片，并可单独选一套版面配置（V3 商户版面），不选就用主域名绑的那套。</span>代理渠道挂一个代理（哪个等级都行，相当于这个代理的分享），一个代理可以有多个渠道，每次投放建一个渠道；非代理渠道不挂代理。<span style="background:#fff3c4;border-radius:3px;padding:0 3px">渠道可以归到一个自定义分组（如「Facebook 组」「8810021 代理组」），也可以不分组，选填；分组只用来筛选和汇总，在「分组管理」里新建、改名、删除。</span>一个渠道只对应一个端；</span><span style="background:#fff3c4;border-radius:3px;padding:0 3px">运营只要点「新增渠道」，按链路一次选完：渠道类型 → 代理 → 端（带出母包）→ 推广域名（默认自动生成，渠道 code 作子域名，也可选一个空闲的独立推广域名）→ 落地指向（落地页 / 主站首页 / 主站注册页）→ 落地页或版面配置 → 广告接入配置（只列端对得上、还没被用过的）；一个渠道只用一个推广域名，一个推广域名只属于一个渠道。跳转域名、防封下载页是公共池，可单独选或用默认，跳转全程带渠道 code 和点击编号。App 只有一个母包，用户下载时系统写入渠道号，不重新打包；PWA 的桌面启动链接带渠道号。保存后自动生成推广链接和二维码。域名被封就换域名，渠道 code 不变，留换域名记录。</span></span></li>
</ul></li>
<li><b><span style="background:#fff3c4;border-radius:3px;padding:0 3px">落地页管理</span></b><span><span style="background:#fff3c4;border-radius:3px;padding:0 3px">参考现有页面新增。</span></span><ul><li><b>仿商城 · 一图流</b><span><span style="background:#fff3c4;border-radius:3px;padding:0 3px">卡片列表，新增时右边实时预览；<span style="background:#fff3c4;border-radius:3px;padding:0 3px">「仿商城」就是 PWA 安装页，桌面名称和图标用 APP 名称和图标，另配启动图、主题色、网页推送；用户在 Facebook 等内置浏览器里打开时，按钮先变「用 Chrome 打开」，打不开就复制链接，带上渠道 code 和点击编号。</span>按投放要求带语言、页面路径、页面标题和分享图、隐私政策链接、自动跳转（默认不跳）。落地页不带渠道：渠道的落地指向选了哪个落地页，它就挂在那个渠道的推广域名上；按钮去哪由渠道的端决定：网页进网站、PWA 弹添加到桌面、安卓下载安装包（下载时写入渠道号）；广告点击编号和渠道 code 系统自动带上。</span></span></li></ul></li>
<li><b>域名管理</b><span>名称不变，沿用现有页面。</span><ul>
<li><b>主域名 · 推广泛域名 · 独立推广域名 · 跳转域名 · 防封下载页 · 下载域名</b><span>按类型登记、检查是否可用：推广域名是渠道入口，一对一（泛域名自动给每个渠道生成子域名，被封一键替换，所有自动子域名的渠道一起换）；跳转域名、防封下载页是公共池，多个渠道共用，被封换掉一个，其他照常轮换；统计只认渠道 code，域名不参与统计；<span style="background:#fff3c4;border-radius:3px;padding:0 3px">新增、编辑先选类型，只填这一类要填的；保存后照提示加 DNS 解析，状态从「检测中」变「已生效」才能用。域名这里不设跳转方式：推广域名落到哪里在新增渠道时选，这里只显示绑了哪个渠道、落到哪里。主域名要选一套版面配置（V3 商户版面），落地指向主站的渠道默认用它。防封下载页只选页面，按钮按主域名里设的救援方式走。原「PWA 设置」去掉，桌面名称、图标、启动图、主题色、推送并到落地页「仿商城」里。</span></span></li>
</ul></li>
<li><b>防封救援（并进域名管理）</b><span>不再单独一页：救援设置在主域名的编辑里，救援记录在主域名那一行上。</span><ul>
<li><b>救援方式 · 救援奖励</b><span><span style="background:#fff3c4;border-radius:3px;padding:0 3px">主域名打不开时弹救援窗（可设能否关闭），救援页从防封下载页里选，救援方式选 PWA 或安装包；救援奖励只给已登录用户，每个账号一次；装好后自动登录原账号。PWA 能否提前缓存救援页待开发确认。</span></span></li>
</ul></li>
<li><b>应用与版本</b><span>合并“渠道包管理＋版本上架”。</span><ul>
<li><b>版本更新 · 自动打包</b><span><span style="background:#fff3c4;border-radius:3px;padding:0 3px">回滚：商户只能回滚自己做的建议更新，选渠道后系统用上一版重建这些子包，下载链接不变；强制更新不能回滚；商户端没有下架，要停止下载就停用渠道。总控可以回滚任一已发布版本：这个版本下架，上一版恢复为当前版本，影响所有用到它的商户；安装包版本由系统自动用上一版重建受影响的子包、链接不变，已装 App 打开时提示；热更直接切回上一版网页内容。回滚要先确认影响范围（商户数、子包数、已装 App 数），写入记录，商户端显示只读记录。</span><span style="background:#fff3c4;border-radius:3px;padding:0 3px">商户端只有「版本更新」和「自动打包」，母包由总控管理。版本更新：总控发布新母包后，选 App 渠道安排更新，跟进实际升级情况。用户点渠道链接下载时，系统照样实时把渠道 code 写进母包。自动打包：要固定安装包文件时（发给代理、传应用商店），选渠道和母包版本生成，子包里已写好渠道 code，不重新签名；可以下载、复制链接、出二维码；下载链接一直不变。更新分两种：强制更新由系统自动重建该商户全部子包，商户端只收到只读通知和更新记录，不用重新上传；建议更新由商户点「更新」选渠道，系统重建这些渠道的子包。</span></span></li><li><b>给研发的两条说明</b><span><span style="background:#fff3c4;border-radius:3px;padding:0 3px">1）所有子包用平台统一的一套签名证书，重建后能覆盖安装。2）App 启动时检查版本并提示用户更新，强制更新靠这个让已装在用户手机上的 App 也升级。</span></span></li>
</ul></li>
<li><b>推广报表</b><span>合并原计划的“推广记录＋推广数据”。</span><ul>
<li><b>新增报表 · 留存报表 · 用户来源 · 事件记录</b><span><span style="background:#fff3c4;border-radius:3px;padding:0 3px">新增报表看用户从哪个渠道进来；留存报表看各渠道用户的质量：按渠道或按注册日期，看次日、3 日、7 日、15 日、30 日留存（第 N 天登录过算留存），另看 7 日首充率、7 日人均充值。</span>新增报表一行一个渠道，两张报表都能按分组筛选（含「未分组」），留存报表还能按分组汇总；筛选日期、渠道类型、代理、渠道（编号 · 渠道名）、广告平台，选了代理渠道下拉只剩他名下的渠道，没有域名筛选；点数字查来源、代理和事件记录；<span style="background:#fff3c4;border-radius:3px;padding:0 3px">叫法和上报事件一致（激活、注册、登录、充值发起、充值、首充；激活只有 App、壳包有），我方记录和发给广告平台的结果放在同一条事件记录里。</span></span></li>
</ul></li>
</ul></li>
<li id="control-scope"><strong>总控端 · 合并为两个页面</strong><ul>
<li><b>「应用与版本」</b><span>选中商户和应用后，在同一页查看母包、发布版本和处理更新问题。</span><ul class="scope-subtree">
<li><b>母包</b><span>维护安卓原生、安卓壳母包和接入能力；查看哪些商户可用、正在使用哪个版本。</span></li>
<li><b>版本</b><span>管理新母包、网页资源及配套配置；写清更新内容、兼容关系、热更还是安装包升级，验证后发布。<span style="background:#fff3c4;border-radius:3px;padding:0 3px">原「更新与维护」并到这里：每个版本一行带升级进度、问题数、处理状态，点「问题」处理缺陷、写入渠道号和更新失败，保留修复记录。</span></span></li>
</ul></li>
<li><b>「推广报表」</b><span>在同一页切换“汇总统计”和“运行记录”，共用商户、日期等筛选条件。</span><ul class="scope-subtree">
<li><b>汇总统计</b><span>在已授权范围内，按集团、商户查看推广结果；明细及导出范围待确认。</span></li>
<li><b>运行记录</b><span>查看接入、广告回传和报表同步异常；涉及母包、版本的问题，跳到“应用与版本”处理。</span></li>
</ul></li>
<li><b>沿用组织管理，操作权限另定</b><span>集团管理、商户管理继续使用；是否允许总控代商户配置、停用、重试，仍需确认；<span style="background:#fff3c4;border-radius:3px;padding:0 3px">强制更新已定由总控发版时选</span>。页面合并不扩大权限。</span></li>
</ul></li></ul></section>
</div>
<div class="scope-summary"><b>这些页面背后，还要服务端接起来</b><p>保存“推广链接／安装包 → 配置、渠道、代理”的对应关系；确认注册和充值成功，去除重复记录，向广告方回传，再生成我方报表。Access Token 只留服务端。</p></div>
<p class="scope-path"><b>运营怎么用：</b><span style="background:#fff3c4;border-radius:3px;padding:0 3px">域名管理中备好推广泛域名和公共池（一次性）→ 落地页管理中先建落地页 → 广告接入中建配置并测试 → 渠道管理中点「新增渠道」（按链路选：渠道类型 → 代理 → 端 → 推广域名 → 落地指向 → 落地页或版面配置 → 广告接入配置），自动拿到链接和二维码 → 投放 → 推广报表中按渠道查结果。</span></p>
<p class="scope-footnote">一份配置只对应一个渠道，各渠道各自保留渠道 code、分别统计。前台必须先接好工具，后台填表不会自动装好埋点。总控母包、版本和维护能力已列入方案；具体数据范围、代操作和强更权限待确认。</p>
</section><p class="note">这是待开发方案，还没改实际产品。已有页面可以沿用，但服务是否接通仍需核对；集团管理、商户管理不用重做。</p><nav aria-label="实施流程" class="route"><a href="#step-01">准备资源</a><span>→</span><a href="#step-02">接入埋点</a><span>→</span><a href="#step-03">配置渠道</a><span>→</span><a href="#step-04">分包分发</a><span>→</span><a href="#step-05">采集行为</a><span>→</span><a href="#step-06">归属与回传</a><span>→</span><a href="#step-07">报表对账</a><span>→</span><a href="#step-08">持续更新</a></nav><main><section class="step" id="step-01"><span class="step-number">01</span><div class="step-intro"><h2>先准备域名和母包</h2><p>做好后：网页能打开，应用能安装，建渠道时可以直接选用。</p></div><div class="duties"><article class="duty"><span class="role">后台 · 运营操作</span><h3>域名管理 · 应用与版本</h3><ul><li>登记域名并选类型：主域名（主站）、推广域名（渠道入口，一对一）、跳转域名和防封下载页（公共池）、下载域名（放母包）。<span style="background:#fff3c4;border-radius:3px;padding:0 3px">渠道的端选 PWA、落地页选仿商城，用户就进仿商城安装页；PWA 的桌面名称、图标、启动图和推送在落地页「仿商城」里配。</span></li><li>总控维护母包（每个端只有一个，用户下载时写入渠道号）和版本；商户查看检查结果，母包发布后直接可用。</li></ul></article><article class="duty"><span class="role">前台 · 用户使用</span><h3>网站与应用开发</h3><ul><li>做好 PC、H5 页面；PWA 还要支持安装和更新。</li><li>准备安卓原生、安卓壳的母包，能正常打开，也能读到渠道 code 和版本。</li></ul></article><article class="duty"><span class="role">服务端 · 系统处理</span><h3>保存域名和安装包</h3><ul><li>记住域名属于哪个商户，检查域名、安全连接和目标页面是否正常。</li><li>保存母包、版本和写入渠道号所需资料；签名私钥由服务端保管。</li></ul></article></div><div class="accept"><b>怎么检查</b>网页能打开，应用能装上并运行。App 只有一个母包，用户下载时系统写入渠道号，不用每个渠道打包。</div></section><section class="step" id="step-02"><span class="step-number">02</span><div class="step-intro"><h2>后台建接入配置，前台接好埋点</h2><p>做好后：有一份经过测试的接入配置，也有能使用它的网页或母包，供后续建渠道时选用。</p></div><figure aria-labelledby="access-map-title" class="access-map" id="access-map">
<figcaption id="access-map-title">广告接入分 4 个接入端</figcaption>

<div class="access-tree">
<div class="access-root"><strong>广告接入</strong><span>按接入端分 4 种，一条配置只选一种</span></div> <div class="access-branches"> <div class="access-group"> <div class="access-kind"><strong>Web</strong><span>服务端发</span><small>落地页记下点击编号（主站入口同样读取点击编号，交给服务端），5 个事件由服务端确认后发</small></div> <ul class="access-leaves"><li><strong>PC</strong><span>电脑浏览器打开</span></li><li><strong>H5</strong><span>手机浏览器打开</span></li></ul></div> <div class="access-group"> <div class="access-kind"><strong>PWA</strong><span>服务端发</span><small>桌面启动链接带渠道 code，5 个事件由服务端发</small></div> <ul class="access-leaves"><li><strong>PWA</strong><span>装到桌面的网页</span></li></ul></div> <div class="access-group"> <div class="access-kind"><strong>App</strong><span>服务端发</span><small>App 读出渠道 code 交给服务端，<span style="background:#fff3c4;border-radius:3px;padding:0 3px">激活（打开 App）</span>和 5 个事件由服务端发</small></div> <ul class="access-leaves"><li><strong>安卓原生</strong><span>原生安装包</span></li></ul></div> <div class="access-group"> <div class="access-kind"><strong>壳包</strong><span>服务端发</span><small>壳内网页只把结果交给服务端，由服务端发给广告平台；<span style="background:#fff3c4;border-radius:3px;padding:0 3px">激活（打开壳包）也由服务端发</span></small></div> <ul class="access-leaves"><li><strong>安卓壳</strong><span>壳包安装包</span></li></ul></div> </div></div></div> <p class="access-note">4 个接入端都由前台带上渠道 code 和点击编号，注册、登录、充值发起、充值、首充都由服务端确认成功后发给广告平台；<span style="background:#fff3c4;border-radius:3px;padding:0 3px">App、壳包多发一个「激活」（打开 App）</span>；同一次行为只发一次。<span style="background:#fff3c4;border-radius:3px;padding:0 3px">没拿到点击编号的用户照样发，带 IP 和 UA（Facebook 还带 fbp），由平台自己匹配，同时按渠道统计。</span></p>
</figure><div class="duties"><article class="duty"><span class="role">后台 · 运营操作</span><h3>广告接入 · 建议新增独立页面</h3><ul><li>填写配置名称，选商户、广告平台、<span style="background:#fff3c4;border-radius:3px;padding:0 3px">接入端（Web / PWA / App / 壳包，一条只选一种）；不在这里选渠道，配置在「新增渠道」时选，这里只显示被哪个渠道用了</span>，登记 Pixel ID（Google 是 Customer ID）。</li><li><span style="background:#fff3c4;border-radius:3px;padding:0 3px">上报事件（Web、PWA 5 个，App、壳包多一个激活）由前端、服务端提前写死，商户只看不改；</span>测试接入；显示测试结果和状态。</li></ul></article><article class="duty"><span class="role">前台 · 用户使用</span><h3>装好行为记录工具</h3><ul><li>WEB 接好网页采集工具，能按渠道 code 读取配置；APP 读出安装包里的渠道 code 交给服务端，壳包接通网页与外壳。</li><li>真实浏览、启动或业务成功才记录；带上访问编号和版本，同一行为不要被网页、应用重复记录。</li></ul></article><article class="duty"><span class="role">服务端 · 系统处理</span><h3>接收记录，发给广告方</h3><ul><li>保存每份接入配置及版本；按渠道提供所需公开配置，接收记录并按选定方式回传，密钥不下发给前台。</li><li>Pixel ID 只决定“发到哪里”；用户从哪来，要靠渠道 code 和来源信息另行判断。</li></ul></article></div><div class="accept"><b>怎么检查</b>实际打开一次，在我方查到记录，再去广告平台核对。只填好后台配置，还不算接好了。</div><div class="accept" style="background:#fff3c4"><b>各平台密钥去哪拿</b>页面上不放，只写在这里，菜单名用各平台官方英文叫法。填好后在广告接入列表里点「测试」，测试通过再给渠道用。<ul style="margin:6px 0 0;padding-left:18px"><li>Facebook：Events Manager › Data sources › 选 Pixel › Settings › Conversions API › Generate access token。填 Pixel ID 和 Access Token。</li><li>TikTok：Events Manager › Web Events › 选 Pixel › Settings › Generate Access Token。填 Pixel Code 和 Access Token。</li><li>Kwai：先开通 API，再到 Kwai Ads Manager 的 Event Manager 里拿；拿不到就找 Kwai account manager。填 Pixel ID 和 Access Token。（菜单名待以 Kwai 后台为准）</li><li>Google Ads：不用填 Conversion ID（服务端用 API 上传，用不到）。<span style="background:#fff3c4;border-radius:3px;padding:0 3px">另外填 Customer ID（Google Ads 后台右上角 123-456-7890 那串），再点「授权 Google 账号」，用对这个账号有管理员权限的 Google 账号登录同意。</span></li></ul></div></section><section class="step" id="step-03"><span class="step-number">03</span><div class="step-intro"><h2>建渠道，绑定代理</h2><p>做好后：每个渠道都能查到对应的端、代理和商户。</p></div><div class="duties"><article class="duty"><span class="role">后台 · 运营操作</span><h3>渠道管理 · 扩展现有页面</h3><ul><li><span style="background:#fff3c4;border-radius:3px;padding:0 3px">商户建渠道，选一个端（PC、H5、PWA、安卓原生、安卓壳）和渠道类型；代理渠道挂一个已有代理（哪个等级都行），非代理渠道不挂；同一代理每次投放、每个端各建一个渠道。</span></li><li><span style="background:#fff3c4;border-radius:3px;padding:0 3px">建渠道时按链路选推广域名、落地指向、落地页或版面配置、广告接入配置，推广域名自动生成或选独立的；只有一种编号：渠道 code，统计只认它。</span></li></ul></article><article class="duty"><span class="role">前台 · 用户使用</span><h3>告诉系统从哪里进入</h3><ul><li>网页带上渠道 code，应用带上渠道 code，打开时交给服务端。</li><li>前台只提供信息，用户归哪个商户、代理，由服务端核对。</li></ul></article><article class="duty"><span class="role">服务端 · 系统处理</span><h3>记住渠道和代理的关系</h3><ul><li>保存渠道、代理、链接和包的对应关系，确认它们属于同一商户。</li><li>记录关系何时生效、谁改过；平台不是代理，代理从一级往下发展。</li></ul></article></div><div class="accept"><b>怎么检查</b>拿到推广链接或下载的安装包，能查回渠道 code、代理和商户；非代理渠道注册的用户不挂代理。</div></section><section class="step" id="step-04"><span class="step-number">04</span><div class="step-intro"><h2>自动生成推广链接和二维码，检查后发出去</h2><p>做好后：投放方拿到可用链接、二维码或下载入口，再到广告平台投放。</p></div><div class="duties"><article class="duty"><span class="role">后台 · 运营操作</span><h3>渠道管理 · 链接、二维码和安装包</h3><ul><li><span style="background:#fff3c4;border-radius:3px;padding:0 3px">渠道保存后，所有渠道都自动生成推广链接和二维码；App 渠道不单独打包，用户下载时系统把渠道号写进母包。</span></li><li>在渠道列表里复制链接、下载二维码；独立推广域名被封点「换域名」，查看换域名记录。</li></ul></article><article class="duty"><span class="role">前台 · 用户使用</span><h3>落地、下载与打开</h3><ul><li>PC、H5 直接打开；PWA 检查安装后打开；应用按确定的方式下载、安装、打开。</li><li>跳转时带住已有来源信息；换域名、安装后再打开都要实测，丢了来源就如实标记。</li></ul></article><article class="duty"><span class="role">服务端 · 系统处理</span><h3>生成链接和安装包</h3><ul><li>保存推广链接／安装包与渠道、代理、接入配置的对应关系；链接带渠道 code，用户下载时把渠道 code 及所需公开配置写进母包，并记录版本。</li><li>保存写入渠道号、检查和分发结果，确保链接指向正确页面或安装包。</li></ul></article></div><div class="accept"><b>怎么检查</b>从推广链接或安装包走一遍，进入正确页面或应用、对应正确渠道。点下载不等于已安装，包生成了也不等于已发出。</div></section><section class="step" id="step-05"><span class="step-number">05</span><div class="step-intro"><h2>记录用户进入、注册和充值</h2><p>做好后：能查到用户从哪进入、做了什么，以及是否真的成功。</p></div><div class="duties"><article class="duty"><span class="role">后台 · 运营操作</span><h3>推广报表 · 用户来源 · 事件记录</h3><ul><li>按商户、日期、渠道类型、代理、分组、渠道、广告平台筛选（每行带商户列），点数字查用户来源和事件记录。</li><li>显示行为发生时间、系统收到时间、来源信息，以及成功、失败或待处理状态。</li></ul></article><article class="duty"><span class="role">前台 · 用户使用</span><h3>用户操作时记录</h3><ul><li>真正打开时记访问或启动；落地页读取 URL 里的点击编号，主站入口同样读取点击编号，交给服务端；后续操作带着同一访问编号，注册成功后关联账号。</li><li>点注册、充值按钮不算成功；断网后重发同一条记录，继续使用原编号。</li></ul></article><article class="duty"><span class="role">服务端 · 系统处理</span><h3>确认是否真的成功</h3><ul><li>账号创建成功才记注册；充值订单确认成功才记充值。</li><li>把访问、账号和订单连起来；同一次成功只记一次，异常记录也保留。</li></ul></article></div><div class="events"><h3>要记录哪些行为（埋点）</h3><table class="event-table"><thead><tr><th>记录什么</th><th>由谁、何时确认</th><th>怎么使用</th></tr></thead><tbody><tr><td>广告曝光／点击</td><td>广告平台记录；用户真正打开我方落地页后，我方才记访问。</td><td>有授权再取广告报表，不能拿我方访问冒充广告点击。</td></tr><tr><td>访问／页面浏览</td><td>用户真正打开网页时记录。</td><td>记住从哪进入、用什么端，以及本次访问编号。</td></tr><tr><td>应用启动</td><td>应用真正启动时记录。</td><td>记住安装包里写入的渠道号、版本和已知来源；点下载不算启动。</td></tr><tr><td>注册成功</td><td>后台确认账号创建成功。</td><td>把账号连到之前的访问，核对渠道和代理，再发送平台要求的注册事件。</td></tr><tr><td>充值成功</td><td>后台确认充值订单成功。</td><td>记住用户、订单、金额和币种，按已确认方案发送购买成功事件。</td></tr><tr><td>提现成功</td><td>后台确认提现成功。</td><td>本期只记我方数据，不发给广告方。</td></tr></tbody></table><p class="note">每条记录能查：编号、发生和收到时间、端、推广链接或安装包、访问编号和已知来源。注册后关联用户，产生订单后关联订单；广告事件名称按平台对应；<span style="background:#fff3c4;border-radius:3px;padding:0 3px">Web、PWA 5 个事件，App、壳包多一个「激活」（打开 App）</span>。</p></div><div class="events" style="background:#fff3c4;padding:14px 16px;border-radius:8px"><h3>各广告商事件配置（前端、服务端写死，后台只展示）</h3><p class="note" style="margin-top:0">前期 Web、PWA 自动上报 5 个事件：注册（CompleteRegistration）、登录（Login）、充值发起（AddToCart）、首充（Subscribe）、充值（Purchase），4 个平台都一样（Kwai 的登录只在 App、壳包报，网页端没有这个事件），全部由我方服务端确认成功后发（各平台的官方事件名见下表）。<span style="background:#fff3c4;border-radius:3px;padding:0 3px">App、壳包多报一个「激活」（打开 App，每台设备装好后第一次打开报一次），Web、PWA 不报；母包不接广告 SDK，激活也由服务端发，不会重复。</span>渠道管理只能选和自己端一致的配置。一份配置只关联一个渠道，不单独填网址或包名，推广域名和安装包都跟着渠道走。提现不发给广告方，只记我方数据。事件名、触发方式和参数由前端、服务端提前写死，总控和商户都不能改；商户在广告接入里只填平台信息、做测试，事件只展示。<span style="background:#fff3c4;border-radius:3px;padding:0 3px">Google：商户先点「授权 Google 账号」，再填 Customer ID；授权后由我方在商户账号里自动建好 Conversion Action，用 Google Ads API 上传；授权失效时广告接入弹窗和列表都会提示重新授权。没有 gclid 的用户改用 Enhanced Conversions（sha256 手机号或邮箱），两样都没有就只记我方报表。</span>首充：Facebook、TikTok 借用 Subscribe，Kwai 自带 EVENT_FIRST_DEPOSIT，Google 另建一个「首充」PURCHASE 类别的 Conversion Action；同一笔首充也会发一次「充值」。服务端用各平台官方接口：Facebook Conversions API、TikTok Events API、Kwai 沿用现有 Kwai-API（快手手册只写了网页代码和第三方监测平台两种上报方式，没写服务端接口）、Google Ads Offline conversion import，我方确认成功后才发。参数写法：平台参数=我方取值字段。Kwai 点击编号参数名是 click_id，页面跳转时要和 pixel_id 一起带上。</p><p style="margin:14px 0 6px"><b>Facebook</b>　<a href="https://developers.facebook.com/docs/meta-pixel/reference" target="_blank" rel="noopener" style="color:var(--accent)">Meta 标准事件文档 ↗</a></p><table class="event-table"><thead><tr><th style="width:20%">事件</th><th style="width:18%">上报的端</th><th style="width:11%">触发方式</th><th style="width:27%">user_data</th><th style="width:24%">custom_data</th></tr></thead><tbody><tr style="background:#fff3c4"><td><b>ActivateApp (custom event)</b><br>激活（打开 App）</td><td>安卓原生、安卓壳（Web、PWA 不报）</td><td>Conversions API</td><td><code style="font-size:12px">event_id=记录ID</code> <code style="font-size:12px">event_time=事件时间</code> <code style="font-size:12px">action_source=website</code><br><code style="font-size:12px">fbc=fbc（对上落地页点击编号时带）</code> <code style="font-size:12px">client_ip_address=clientIp</code> <code style="font-size:12px">client_user_agent=userAgent</code> <code style="font-size:12px">external_id=sha256(deviceId)</code></td><td>--</td></tr><tr><td><b>CompleteRegistration</b><br>注册</td><td>全部端（PC、H5、PWA、安卓原生、安卓壳）</td><td>Conversions API</td><td><code style="font-size:12px">event_id=记录ID</code> <code style="font-size:12px">event_time=事件时间</code> <code style="font-size:12px">action_source=website</code> <code style="font-size:12px">event_source_url=落地页地址</code><br><code style="font-size:12px">fbc=fbc（用落地页记下的 fbclid 拼成）</code> <code style="font-size:12px">fbp=fbp（落地页生成 fb.1.时间.随机数</code> <code style="font-size:12px">跳转带到主站）</code> <code style="font-size:12px">client_ip_address=clientIp</code> <code style="font-size:12px">client_user_agent=userAgent</code> <code style="font-size:12px">external_id=sha256(userid)</code></td><td>--</td></tr><tr><td><b>Login (custom event)</b><br>登录</td><td>全部端（PC、H5、PWA、安卓原生、安卓壳）</td><td>Conversions API</td><td><code style="font-size:12px">event_id=记录ID</code> <code style="font-size:12px">event_time=事件时间</code> <code style="font-size:12px">action_source=website</code> <code style="font-size:12px">event_source_url=落地页地址</code><br><code style="font-size:12px">fbc=fbc（用落地页记下的 fbclid 拼成）</code> <code style="font-size:12px">fbp=fbp（落地页生成 fb.1.时间.随机数</code> <code style="font-size:12px">跳转带到主站）</code> <code style="font-size:12px">client_ip_address=clientIp</code> <code style="font-size:12px">client_user_agent=userAgent</code> <code style="font-size:12px">external_id=sha256(userid)</code></td><td>--</td></tr><tr><td><b>AddToCart</b><br>充值发起</td><td>全部端（PC、H5、PWA、安卓原生、安卓壳）</td><td>Conversions API</td><td><code style="font-size:12px">event_id=记录ID</code> <code style="font-size:12px">event_time=事件时间</code> <code style="font-size:12px">action_source=website</code> <code style="font-size:12px">event_source_url=落地页地址</code><br><code style="font-size:12px">fbc=fbc（用落地页记下的 fbclid 拼成）</code> <code style="font-size:12px">fbp=fbp（落地页生成 fb.1.时间.随机数</code> <code style="font-size:12px">跳转带到主站）</code> <code style="font-size:12px">client_ip_address=clientIp</code> <code style="font-size:12px">client_user_agent=userAgent</code> <code style="font-size:12px">external_id=sha256(userid)</code></td><td><code style="font-size:12px">value=depositAmount</code> <code style="font-size:12px">currency=商户币种（daman 为 INR）</code></td></tr><tr><td><b>Purchase</b><br>充值</td><td>全部端（PC、H5、PWA、安卓原生、安卓壳）</td><td>Conversions API</td><td><code style="font-size:12px">event_id=记录ID</code> <code style="font-size:12px">event_time=事件时间</code> <code style="font-size:12 h style="width:11%">触发方式</th><th style="width:27%">ClickConversion（gclid 点击标识）</th><th style="width:24%">ClickConversion（conversion_value、order_id）</th></tr></thead><tbody><tr style="background:#fff3c4"><td><b>DOWNLOAD</b><br>激活（打开 App）</td><td>安卓原生、安卓壳（Web、PWA 不报）</td><td>Offline conversion import</td><td><code style="font-size:12px">conversion_action=我方建好的 Conversion Action</code> <code style="font-size:12px">conversion_date_time=事件时间</code><br><code style="font-size:12px">gclid=gclid（对上时带）</code></td><td>--</td></tr><tr><td><b>SIGNUP</b><br>注册</td><td>全部端（PC、H5、PWA、安卓原生、安卓壳）</td><td>Offline conversion import</td><td><code style="font-size:12px">conversion_action=我方建好的 Conversion Action</code> <code style="font-size:12px">conversion_date_time=事件时间</code> <code style="font-size:12px">gclid=gclid（落地页记下的）</code></td><td>--</td></tr><tr><td><b>DEFAULT (Login)</b><br>登录</td><td>全部端（PC、H5、PWA、安卓原生、安卓壳）</td><td>Offline conversion import</td><td><code style="font-size:12px">conversion_action=我方建好的 Conversion Action</code> <code style="font-size:12px">conversion_date_time=事件时间</code> <code style="font-size:12px">gclid=gclid（落地页记下的）</code></td><td>--</td></tr><tr><td><b>ADD_TO_CART</b><br>充值发起</td><td>全部端（PC、H5、PWA、安卓原生、安卓壳）</td><td>Offline conversion import</td><td><code style="font-size:12px">conversion_action=我方建好的 Conversion Action</code> <code style="font-size:12px">conversion_date_time=事件时间</code> <code style="font-size:12px">gclid=gclid（落地页记下的）</code></td><td><code style="font-size:12px">conversion_value=depositAmount</code> <code style="font-size:12px">currency_code=商户币种（daman 为 INR）</code> <code style="font-size:12px">order_id=orderId</code></td></tr><tr><td><b>PURCHASE</b><br>充值</td><td>全部端（PC、H5、PWA、安卓原生、安卓壳）</td><td>Offline conversion import</td><td><code style="font-size:12px">conversion_action=我方建好的 Conversion Action</code> <code style="font-size:12px">conversion_date_time=事件时间</code> <code style="font-size:12px">gclid=gclid（落地页记下的）</code></td><td><code style="font-size:12px">conversion_value=orderAmount</code> <code style="font-size:12px">currency_code=商户币种（daman 为 INR）</code> <code style="font-size:12px">order_id=orderId</code></td></tr><tr><td><b>PURCHASE (first_deposit)</b><br>首充</td><td>全部端（PC、H5、PWA、安卓原生、安卓壳）</td><td>Offline conversion import</td><td><code style="font-size:12px">conversion_action=我方建好的 Conversion Action</code> <code style="font-size:12px">conversion_date_time=事件时间</code> <code style="font-size:12px">gclid=gclid（落地页记下的）</code></td><td><code style="font-size:12px">conversion_value=orderAmount</code> <code style="font-size:12px">currency_code=商户币种（daman 为 INR）</code> <code style="font-size:12px">order_id=orderId</code></td></tr></tbody></table></div><div class="accept"><b>怎么检查</b>同一条注册成功记录发多次，注册人数仍只加 1；充值失败或处理中，不算充值成功。</div></section><section class="step" id="step-06"><span class="step-number">06</span><div class="step-intro"><h2>确认渠道和代理，再给广告方发事件</h2><p>做好后：我方留真实记录；广告方另收一份，用于匹配广告效果。</p></div><div class="duties"><article class="duty"><span class="role">后台 · 运营操作</span><h3>渠道管理；推广报表 · 事件记录</h3><ul><li>查看用户对应的商户、渠道、代理；来源不明或互相冲突的记录单独查看。</li><li>打开事件记录，看是否发出、失败原因、重试结果；对方收到，不代表已匹配到广告。</li></ul></article><article class="duty"><span class="role">前台 · 用户使用</span><h3>一路带着来源信息</h3><ul><li>继续传递拿得到的来源信息、访问编号和广告点击编号。</li><li>新用户从绑定了代理的渠道注册，无需再填邀请码；老用户换渠道，不自动更换上级。</li></ul></article><article class="duty"><span class="role">服务端 · 系统处理</span><h3>核对归属，发送事件</h3><ul><li>核对推广链接或安装包，确认渠道和代理；广告来源、邀请代理分别保存。</li><li>按平台要求发事件，避免重复；来源不明就保留未知，<span style="background:#fff3c4;border-radius:3px;padding:0 3px">没拿到点击编号也照样发，带 IP 和 UA（Facebook 还带 fbp），由平台自己匹配</span>；发送失败也不影响我方记录。</li></ul></article></div><div class="endpoints"><div><b>我方归属</b>推广链接／安装包 → 渠道和代理 → 用户。保存当时的关系，用来统计我方报表。</div><div><b>广告归因</b>把真实行为和已知来源（点击编号，没有就只带 IP、UA）发给广告平台，由平台判断对应哪条广告；并非每条都能匹配成功。</div></div><div class="accept"><b>怎么检查</b>用户可以既“来自 Facebook”，又“属于代理 8810021”。广告来源不明，不影响已知代理，也不能直接当自然流量。</div></section><section class="step" id="step-07"><span class="step-number">07</span><div class="step-intro"><h2>在商户和集团报表里看到结果</h2><p>做好后：查到各渠道的真实效果；拿到广告报表授权后，再对照双方数据。</p></div><div class="duties"><article class="duty"><span class="role">后台 · 运营操作</span><h3>推广报表 · 建议新增</h3><ul><li>商户端按商户、日期、渠道类型、代理、分组、渠道、广告平台筛选，每行带商户列；<span style="background:#fff3c4;border-radius:3px;padding:0 3px">注册按注册日期算（哪天注册算哪天，算进注册时的渠道，没有归因有效期）；首充、充值人数和金额按到账日期算（1 号注册、3 号到账算 3 号）；金额只算实付，不含赠送</span>：新增报表看落地页浏览、点按钮数、注册、首充、充值；留存报表看各渠道次日到 30 日留存、7 日首充率、7 日人均充值；点击数字能看明细。</li><li>总控在“推广报表”的汇总统计中，按已授权范围看集团、商户数据；广告曝光、点击等另列，标明来源、时区和更新时间。</li></ul></article><article class="duty"><span class="role">前台 · 用户使用</span><h3>配合核对真实操作</h3><ul><li>持续准确记录行为和版本；最终人数由服务端统计，前台不能生成广告曝光、点击数据。</li><li>联调时实际打开推广链接、注册账号，方便前后核对同一个用户。</li></ul></article><article class="duty"><span class="role">服务端 · 系统处理</span><h3>统计我方数据，对照广告报表</h3><ul><li>用我方确认的记录统计，人数、次数、金额分开；同一个用户不能因查看角度不同重复计入总数。</li><li>有授权再取广告报表，保留更正记录；没拿到数据显示“未获取”，不能填 0，也不能硬分给代理。</li></ul></article></div><div class="accept"><b>怎么检查</b>渠道 A1、代理 8810021、所属商户都能查到这位新用户，但商户总人数只加 1；广告回传失败也不影响查看。</div></section><section class="step" id="step-08"><span class="step-number">08</span><div class="step-intro"><h2>上线后，能更新，也能查问题</h2><p>做好后：总控提供可用版本并维护，商户安排渠道更新，系统能查到用户实际用的版本和异常原因。</p></div><div class="duties"><article class="duty"><span class="role">后台 · 运营操作</span><h3>应用与版本 · 总控维护，商户直接用</h3><ul><li>总控在“应用与版本”中维护母包，切到「版本」页签完成验证，写清更新内容、适用商户和更新方式。</li><li><span style="background:#fff3c4;border-radius:3px;padding:0 3px">PWA 由商户在落地页「仿商城」里改好后保存；新内容先在后台准备好（预加载）再一次切换，切换时不白屏（待开发确认）。</span></li><li>商户在“应用与版本”的版本更新中选择可用版本，确定更新哪些 App 渠道，查看升级进度。</li><li>同页「版本」里点各版本的「问题」处理母包缺陷和更新故障；商户查看受影响渠道和用户，跟进修复结果。</li></ul></article><article class="duty"><span class="role">前台 · 用户使用</span><h3>检查和执行更新</h3><ul><li>上报当前实际使用的版本；按支持的方式检查、下载、提示或执行更新。</li><li>PWA、壳内页面热更、安装包升级分别处理；失败如实记录，强制更新不等于自动安装。</li></ul></article><article class="duty"><span class="role">服务端 · 系统处理</span><h3>保存版本和处理记录</h3><ul><li>保存各版本的配套关系、发布和更新结果；历史记录保留当时的版本和归属。</li><li>记录各商户、渠道和用户实际使用的版本，支持查错与重试；配置变化不直接改写历史，故障恢复方式需按更新类型验证。</li></ul></article></div><div class="accept version-handoff"><b>版本怎样交到用户手里</b>总控验证并发布可用版本 → 商户选择 App 渠道 → 按类型热更或发新版母包、验证、分发 → 用户实际更新 → 回报运行版本。<p>总控发布母包，不会自动改掉用户手机里的旧包。<span style="background:#fff3c4;border-radius:3px;padding:0 3px">已定：总控发版时选强制更新或建议更新。强制更新由系统自动重建所有商户的子包，下载链接不变，商户只收到通知；建议更新由商户选渠道后重建。已装的 App 启动时检查版本、提示用户更新。</span></p></div><div class="accept"><b>怎么检查</b>发布新版母包后，没升级的用户仍显示旧版本；出了问题能查到对应渠道、任务、行为或版本。</div></section></main><section class="decision"><h2>开工前，还要定清这 4 类规则</h2><div class="decision-grid"><p><b>归属与统计</b>邀请码与渠道不一致时归谁；同一人跨端怎么算；每天按哪个时区统计。</p><p><b>权限与启停</b>总控是否需要代商户配置、停用或重试；谁能发包、导出；集团、代理能看哪些明细；停用和配置更换如何影响已发链接、旧包。</p><p><b>资金口径</b>不同币种怎么汇总。返佣结算不在本轮制定。</p><p><b>接入、分发与更新</b>安装包从哪下载；哪些内容能热更、更新失败怎么办；强制或建议更新<span style="background:#fff3c4;border-radius:3px;padding:0 3px">已定（见第 08 节「版本怎样交到用户手里」）</span>。</p></div></section><section class="delivery"><h2>建议先做 H5，把注册 +1 跑通</h2><p>准备域名 → 装好记录工具 → 建渠道、绑代理 → 生成推广链接 → 用户注册 → 我方保存、广告方另收 → 渠道报表 +1。</p><p><small>前台、后台、服务端一起配合，用真实操作核对结果。只有表单或模拟数字不算做好；跑通后再扩展应用分包、其他平台和更新。</small></p></section><footer>当前是方案，前台和 V3 实际页面尚未修改；开工前需确认上述规则和要改的页面。</footer></div></div></template><section id="app">
