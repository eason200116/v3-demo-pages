&lt;link rel=&quot;stylesheet&quot; href=&quot;https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap&quot;&gt;
&lt;style&gt;
/* 布局：单栏阅读页，两张横向可滚动的图 + 两张对照表 + 问题清单；渠道是全图唯一的强调色 */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#1b2430; --muted:#5d6878; --line:#d5dbe3;
  --edge:#7b8696; --hub:#1f5fa8; --hub-soft:#e6eef8; --lane:#eef1f5;
  --warn:#b4471f; --warn-soft:#fbeee8; --pend:#8a6a10; --pend-soft:#f8f1dc;
  --f-body:&quot;Noto Sans SC&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,system-ui,sans-serif;
  --f-mono:&quot;JetBrains Mono&quot;,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=&quot;light&quot;]){
  --bg:#12161c; --surface:#1a2028; --fg:#e4e8ee; --muted:#9aa4b2; --line:#2f3946;
  --edge:#8794a6; --hub:#6aa6ea; --hub-soft:#1c2c40; --lane:#171c23;
  --warn:#f08a62; --warn-soft:#2e1d16; --pend:#e0bf62; --pend-soft:#2a2414; color-scheme:dark}}
:root[data-theme=&quot;dark&quot;]{
  --bg:#12161c; --surface:#1a2028; --fg:#e4e8ee; --muted:#9aa4b2; --line:#2f3946;
  --edge:#8794a6; --hub:#6aa6ea; --hub-soft:#1c2c40; --lane:#171c23;
  --warn:#f08a62; --warn-soft:#2e1d16; --pend:#e0bf62; --pend-soft:#2a2414; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.7 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:36px}
h1{font-size:28px;line-height:1.3;margin:0 0 8px;text-wrap:balance}
h2{font-size:19px;margin:0 0 6px;text-wrap:balance}
p{margin:0}
.lead{color:var(--muted);max-width:68ch}
.mono{font-family:var(--f-mono);font-size:.92em}
.key{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px;font-size:14px}
.key span{display:inline-flex;align-items:center;gap:6px}
.key b{color:var(--hub)}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scroll svg{display:block;min-width:1000px;width:100%;height:auto}
figcaption{color:var(--muted);font-size:13.5px;margin-top:10px;max-width:90ch}
/* svg 样式 */
svg{color:var(--edge)}
.n{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.hub{fill:var(--hub-soft);stroke:var(--hub);stroke-width:2}
.pool{fill:var(--surface);stroke:var(--edge);stroke-width:1.2;stroke-dasharray:5 4}
.lane{fill:var(--lane)}
.t{fill:var(--fg);font:700 15px var(--f-body)}
.th{fill:var(--hub);font:700 18px var(--f-body)}
.s{fill:var(--muted);font:400 12.5px var(--f-body)}
.sm{fill:var(--muted);font:400 12px var(--f-mono)}
.e{fill:none;stroke:var(--edge);stroke-width:1.5}
.ed{fill:none;stroke:var(--edge);stroke-width:1.3;stroke-dasharray:5 4}
.lb{fill:var(--fg);font:500 12.5px var(--f-body)}
.lbm{fill:var(--muted);font:400 11.5px var(--f-body)}
.card{fill:var(--hub);font:700 13px var(--f-mono)}
.ln{fill:var(--muted);font:700 13px var(--f-body);letter-spacing:.06em}
.tg1{fill:var(--hub);font:700 11.5px var(--f-body);letter-spacing:.08em}.tg2{fill:var(--pend);font:700 11.5px var(--f-body);letter-spacing:.08em}.tg3{fill:var(--warn);font:700 11.5px var(--f-body);letter-spacing:.08em}.tgx{fill:var(--muted);font:700 11.5px var(--f-body);letter-spacing:.08em}
.fh{margin:0 0 10px;font-size:16px}.key b.k1{color:var(--hub)}.key b.k2{color:var(--pend)}.key b.k3{color:var(--warn)}
.dl{fill:var(--hub);font:500 12px var(--f-body);text-decoration:underline}a:focus-visible .dl,a:hover .dl{fill:var(--fg)}
/* 表 */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:500;color:var(--muted);background:var(--lane)}
tr:last-child td{border-bottom:0}
td.mono{font-family:var(--f-mono);font-size:13px}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.two .tw:last-child{max-width:560px}
/* 问题 */
ol.iss{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:i}
ol.iss li{counter-increment:i;display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 10px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:12px 14px}
ol.iss li::before{content:counter(i);grid-row:span 2;width:24px;height:24px;border-radius:50%;background:var(--warn-soft);color:var(--warn);font:700 13px/24px var(--f-body);text-align:center}
ol.iss li.p{border-left-color:var(--pend)}
ol.iss li.p::before{background:var(--pend-soft);color:var(--pend);content:&quot;定&quot;}
.iss b{font-weight:600}
.iss .w{color:var(--muted);font-size:14px}
.tagp{font-size:12px;padding:1px 8px;border-radius:10px;background:var(--pend-soft);color:var(--pend);margin-left:6px;white-space:nowrap}
.foot{color:var(--muted);font-size:13px}

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;header&gt;&lt;div class=&quot;brand&quot;&gt;V3 &lt;span class=&quot;muted&quot;&gt; · 推广落地方案&lt;/span&gt;&lt;/div&gt;&lt;button id=&quot;print&quot; type=&quot;button&quot;&gt;打印 / 存为 PDF&lt;/button&gt;&lt;/header&gt;&lt;h1&gt;从准备到报表，&lt;br/&gt;每一步由谁做、做什么。&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;商户给代理分推广链接（App 用户下载的母包会写入渠道号），用户进入后注册、充值，最后在后台查清：人从哪来，归谁，带来了多少效果。&lt;/p&gt;&lt;div class=&quot;goal&quot;&gt;&lt;p&gt;&lt;b&gt;贯穿全文的例子：&lt;/b&gt;商户创建 H5 渠道 A1，绑定代理 8810021；一个用户通过 A1 的 H5 链接注册，后台能查出其渠道、代理，注册用户增加 1。&lt;/p&gt;&lt;/div&gt;&lt;section aria-labelledby=&quot;scope-title&quot; class=&quot;scope-directory&quot; id=&quot;scope-directory&quot;&gt;
&lt;h2 id=&quot;scope-title&quot;&gt;前后台分别做什么&lt;/h2&gt;
&lt;p class=&quot;scope-intro&quot;&gt;按下面这棵树分工，后面的 8 个阶段说明具体怎么做。&lt;/p&gt;
&lt;div class=&quot;scope-columns&quot;&gt;
&lt;section aria-labelledby=&quot;scope-c&quot; class=&quot;scope-side&quot;&gt;&lt;h3 id=&quot;scope-c&quot;&gt;C 端 · 先接好记录能力&lt;/h3&gt;
&lt;ul class=&quot;scope-tree&quot;&gt;
&lt;li&gt;&lt;strong&gt;Web · PC、H5、PWA&lt;/strong&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;读取渠道 code&lt;/b&gt;&lt;span&gt;打开推广链接，读取渠道 code，向服务端取得对应的接入配置。&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;记下点击编号&lt;/b&gt;&lt;span&gt;落地页（或主站入口）记下广告点击编号（如 fbclid、ttclid、gclid）交给服务端；5 个事件都由服务端确认成功后发给平台，没拿到点击编号也照发，带 IP 和 UA，由平台匹配。&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;带住来源&lt;/b&gt;&lt;span&gt;页面跳转、注册时带着访问编号和可用来源；PWA 另查安装后打开是否能接续。&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;把记录交给服务端&lt;/b&gt;&lt;span&gt;记录能关联渠道、用户和订单；重发同一条记录，不能重复计数。&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;APP · 安卓原生 / 安卓壳&lt;/strong&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;不接广告 SDK&lt;/b&gt;&lt;span&gt;母包不接广告平台的 SDK，也不接第三方归因工具；5 个事件都由服务端确认成功后发给平台。&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;安装包读自己的渠道号&lt;/b&gt;&lt;span&gt;用户下载时服务端把渠道 code 写进母包（不重新签名）；App 运行后读出来交给服务端核对渠道。&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;壳包多接一层&lt;/b&gt;&lt;span&gt;壳内网页只把注册、充值成功结果交给服务端，由服务端发给广告平台，避免重复。&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;实测安装后的路径&lt;/b&gt;&lt;span&gt;从广告到落地页、下载、安装、启动走一遍；来源拿不到就保留未知，不能凭安装包里的渠道号认定具体广告。&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
&lt;section aria-labelledby=&quot;scope-b&quot; class=&quot;scope-side&quot;&gt;&lt;h3 id=&quot;scope-b&quot;&gt;B 端 · 配置入口、查看结果&lt;/h3&gt;
&lt;ul class=&quot;scope-tree&quot;&gt;
&lt;li id=&quot;merchant-scope&quot;&gt;&lt;strong&gt;商户端 · 六个页面&lt;/strong&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;广告接入&lt;/b&gt;&lt;span&gt;原“推广归因配置”，新增独立页面。&lt;/span&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;平台配置 · 接入验证&lt;/b&gt;&lt;span&gt;在一个列表里选广告平台，选 &lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;接入端（Web / PWA / App / 壳包，一条只选一种）；不在这里选渠道，配置在「新增渠道」时选，这里只显示被哪个渠道用了&lt;/span&gt;，填 Pixel ID（Google 是 Conversion ID）并测试；&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;5 个上报事件只展示，商户不用配置。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;渠道管理&lt;/b&gt;&lt;span&gt;名称沿用现有页面，在上面扩展。&lt;/span&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;渠道 · 推广链接&lt;/b&gt;&lt;span&gt;&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;渠道只分代理渠道和非代理渠道，另有一个系统自带的「主站直接访问」渠道（不能删、不挂代理、不发平台）；&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;广告接入配置可选「不接广告平台」（群发链接、自己推广），不标红；落地指向主站首页或注册页时，可设分享卡片，并可单独选一套版面配置（V3 商户版面），不选就用主域名绑的那套。&lt;/span&gt;代理渠道挂一个代理（哪个等级都行，相当于这个代理的分享），一个代理可以有多个渠道，每次投放建一个渠道；非代理渠道不挂代理。&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;渠道可以归到一个自定义分组（如「Facebook 组」「8810021 代理组」），也可以不分组，选填；分组只用来筛选和汇总，在「分组管理」里新建、改名、删除。&lt;/span&gt;一个渠道只对应一个端；&lt;/span&gt;&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;运营只要点「新增渠道」，按链路一次选完：渠道类型 → 代理 → 端（带出母包）→ 推广域名（默认自动生成，渠道 code 作子域名，也可选一个空闲的独立推广域名）→ 落地指向（落地页 / 主站首页 / 主站注册页）→ 落地页或版面配置 → 广告接入配置（只列端对得上、还没被用过的）；一个渠道只用一个推广域名，一个推广域名只属于一个渠道。跳转域名、防封下载页是公共池，可单独选或用默认，跳转全程带渠道 code 和点击编号。App 只有一个母包，用户下载时系统写入渠道号，不重新打包；PWA 的桌面启动链接带渠道号。保存后自动生成推广链接和二维码。域名被封就换域名，渠道 code 不变，留换域名记录。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;落地页管理&lt;/span&gt;&lt;/b&gt;&lt;span&gt;&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;参考现有页面新增。&lt;/span&gt;&lt;/span&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;仿商城 · 一图流&lt;/b&gt;&lt;span&gt;&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;卡片列表，新增时右边实时预览；&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;「仿商城」就是 PWA 安装页，桌面名称和图标用 APP 名称和图标，另配启动图、主题色、网页推送；用户在 Facebook 等内置浏览器里打开时，按钮先变「用 Chrome 打开」，打不开就复制链接，带上渠道 code 和点击编号。&lt;/span&gt;按投放要求带语言、页面路径、页面标题和分享图、隐私政策链接、自动跳转（默认不跳）。落地页不带渠道：渠道的落地指向选了哪个落地页，它就挂在那个渠道的推广域名上；按钮去哪由渠道的端决定：网页进网站、PWA 弹添加到桌面、安卓下载安装包（下载时写入渠道号）；广告点击编号和渠道 code 系统自动带上。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;域名管理&lt;/b&gt;&lt;span&gt;名称不变，沿用现有页面。&lt;/span&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;主域名 · 推广泛域名 · 独立推广域名 · 跳转域名 · 防封下载页 · 下载域名&lt;/b&gt;&lt;span&gt;按类型登记、检查是否可用：推广域名是渠道入口，一对一（泛域名自动给每个渠道生成子域名，被封一键替换，所有自动子域名的渠道一起换）；跳转域名、防封下载页是公共池，多个渠道共用，被封换掉一个，其他照常轮换；统计只认渠道 code，域名不参与统计；&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;新增、编辑先选类型，只填这一类要填的；保存后照提示加 DNS 解析，状态从「检测中」变「已生效」才能用。域名这里不设跳转方式：推广域名落到哪里在新增渠道时选，这里只显示绑了哪个渠道、落到哪里。主域名要选一套版面配置（V3 商户版面），落地指向主站的渠道默认用它。防封下载页只选页面，按钮按主域名里设的救援方式走。原「PWA 设置」去掉，桌面名称、图标、启动图、主题色、推送并到落地页「仿商城」里。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;防封救援（并进域名管理）&lt;/b&gt;&lt;span&gt;不再单独一页：救援设置在主域名的编辑里，救援记录在主域名那一行上。&lt;/span&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;救援方式 · 救援奖励&lt;/b&gt;&lt;span&gt;&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;主域名打不开时弹救援窗（可设能否关闭），救援页从防封下载页里选，救援方式选 PWA 或安装包；救援奖励只给已登录用户，每个账号一次；装好后自动登录原账号。PWA 能否提前缓存救援页待开发确认。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;应用与版本&lt;/b&gt;&lt;span&gt;合并“渠道包管理＋版本上架”。&lt;/span&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;母包 · 版本更新&lt;/b&gt;&lt;span&gt;&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;查看总控提供的母包（不用选用，直接可用）；不再给每个渠道打包：用户从哪个渠道下载，系统就把那个渠道号写进母包。更新时选择 App 渠道，跟进实际升级情况。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;推广报表&lt;/b&gt;&lt;span&gt;合并原计划的“推广记录＋推广数据”。&lt;/span&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;新增报表 · 留存报表 · 用户来源 · 事件记录&lt;/b&gt;&lt;span&gt;&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;新增报表看用户从哪个渠道进来；留存报表看各渠道用户的质量：按渠道或按注册日期，看次日、3 日、7 日、15 日、30 日留存（第 N 天登录过算留存），另看 7 日首充率、7 日人均充值。&lt;/span&gt;新增报表一行一个渠道，两张报表都能按分组筛选（含「未分组」），留存报表还能按分组汇总；筛选日期、渠道类型、代理、渠道（编号 · 渠道名）、广告平台，选了代理渠道下拉只剩他名下的渠道，没有域名筛选；点数字查来源、代理和事件记录；&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;叫法和 5 个事件一致（注册、登录、充值发起、充值、首充），我方记录和发给广告平台的结果放在同一条事件记录里。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;/li&gt;
&lt;li id=&quot;control-scope&quot;&gt;&lt;strong&gt;总控端 · 合并为两个页面&lt;/strong&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;「应用与版本」&lt;/b&gt;&lt;span&gt;选中商户和应用后，在同一页查看母包、发布版本和处理更新问题。&lt;/span&gt;&lt;ul class=&quot;scope-subtree&quot;&gt;
&lt;li&gt;&lt;b&gt;母包&lt;/b&gt;&lt;span&gt;维护安卓原生、安卓壳母包和接入能力；查看哪些商户可用、正在使用哪个版本。&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;版本&lt;/b&gt;&lt;span&gt;管理新母包、网页资源及配套配置；写清更新内容、兼容关系、热更还是安装包升级，验证后发布。&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;原「更新与维护」并到这里：每个版本一行带升级进度、问题数、处理状态，点「问题」处理缺陷、写入渠道号和更新失败，保留修复记录。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;「推广报表」&lt;/b&gt;&lt;span&gt;在同一页切换“汇总统计”和“运行记录”，共用商户、日期等筛选条件。&lt;/span&gt;&lt;ul class=&quot;scope-subtree&quot;&gt;
&lt;li&gt;&lt;b&gt;汇总统计&lt;/b&gt;&lt;span&gt;在已授权范围内，按集团、商户查看推广结果；明细及导出范围待确认。&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;运行记录&lt;/b&gt;&lt;span&gt;查看接入、广告回传和报表同步异常；涉及母包、版本的问题，跳到“应用与版本”处理。&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;沿用组织管理，操作权限另定&lt;/b&gt;&lt;span&gt;集团管理、商户管理继续使用；是否允许总控代商户配置、停用、重试或强更，仍需确认。页面合并不扩大权限。&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
&lt;/div&gt;
&lt;div class=&quot;scope-summary&quot;&gt;&lt;b&gt;这些页面背后，还要服务端接起来&lt;/b&gt;&lt;p&gt;保存“推广链接／安装包 → 配置、渠道、代理”的对应关系；确认注册和充值成功，去除重复记录，向广告方回传，再生成我方报表。Access Token 只留服务端。&lt;/p&gt;&lt;/div&gt;
&lt;p class=&quot;scope-path&quot;&gt;&lt;b&gt;运营怎么用：&lt;/b&gt;&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;域名管理中备好推广泛域名和公共池（一次性）→ 落地页管理中先建落地页 → 广告接入中建配置并测试 → 渠道管理中点「新增渠道」（按链路选：渠道类型 → 代理 → 端 → 推广域名 → 落地指向 → 落地页或版面配置 → 广告接入配置），自动拿到链接和二维码 → 投放 → 推广报表中按渠道查结果。&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;scope-footnote&quot;&gt;一份配置只对应一个渠道，各渠道各自保留渠道 code、分别统计。前台必须先接好工具，后台填表不会自动装好埋点。总控母包、版本和维护能力已列入方案；具体数据范围、代操作和强更权限待确认。&lt;/p&gt;
&lt;/section&gt;&lt;p class=&quot;note&quot;&gt;这是待开发方案，还没改实际产品。已有页面可以沿用，但服务是否接通仍需核对；集团管理、商户管理不用重做。&lt;/p&gt;&lt;nav aria-label=&quot;实施流程&quot; class=&quot;route&quot;&gt;&lt;a href=&quot;#step-01&quot;&gt;准备资源&lt;/a&gt;&lt;span&gt;→&lt;/span&gt;&lt;a href=&quot;#step-02&quot;&gt;接入埋点&lt;/a&gt;&lt;span&gt;→&lt;/span&gt;&lt;a href=&quot;#step-03&quot;&gt;配置渠道&lt;/a&gt;&lt;span&gt;→&lt;/span&gt;&lt;a href=&quot;#step-04&quot;&gt;分包分发&lt;/a&gt;&lt;span&gt;→&lt;/span&gt;&lt;a href=&quot;#step-05&quot;&gt;采集行为&lt;/a&gt;&lt;span&gt;→&lt;/span&gt;&lt;a href=&quot;#step-06&quot;&gt;归属与回传&lt;/a&gt;&lt;span&gt;→&lt;/span&gt;&lt;a href=&quot;#step-07&quot;&gt;报表对账&lt;/a&gt;&lt;span&gt;→&lt;/span&gt;&lt;a href=&quot;#step-08&quot;&gt;持续更新&lt;/a&gt;&lt;/nav&gt;&lt;main&gt;&lt;section class=&quot;step&quot; id=&quot;step-01&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;01&lt;/span&gt;&lt;div class=&quot;step-intro&quot;&gt;&lt;h2&gt;先准备域名和母包&lt;/h2&gt;&lt;p&gt;做好后：网页能打开，应用能安装，建渠道时可以直接选用。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;duties&quot;&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;后台 · 运营操作&lt;/span&gt;&lt;h3&gt;域名管理 · 应用与版本&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;登记域名并选类型：主域名（主站）、推广域名（渠道入口，一对一）、跳转域名和防封下载页（公共池）、下载域名（放母包）。&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;渠道的端选 PWA、落地页选仿商城，用户就进仿商城安装页；PWA 的桌面名称、图标、启动图和推送在落地页「仿商城」里配。&lt;/span&gt;&lt;/li&gt;&lt;li&gt;总控维护母包（每个端只有一个，用户下载时写入渠道号）和版本；商户查看检查结果，母包发布后直接可用。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;前台 · 用户使用&lt;/span&gt;&lt;h3&gt;网站与应用开发&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;做好 PC、H5 页面；PWA 还要支持安装和更新。&lt;/li&gt;&lt;li&gt;准备安卓原生、安卓壳的母包，能正常打开，也能读到渠道 code 和版本。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;服务端 · 系统处理&lt;/span&gt;&lt;h3&gt;保存域名和安装包&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;记住域名属于哪个商户，检查域名、安全连接和目标页面是否正常。&lt;/li&gt;&lt;li&gt;保存母包、版本和写入渠道号所需资料；签名私钥由服务端保管。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;/div&gt;&lt;div class=&quot;accept&quot;&gt;&lt;b&gt;怎么检查&lt;/b&gt;网页能打开，应用能装上并运行。App 只有一个母包，用户下载时系统写入渠道号，不用每个渠道打包。&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;step&quot; id=&quot;step-02&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;02&lt;/span&gt;&lt;div class=&quot;step-intro&quot;&gt;&lt;h2&gt;后台建接入配置，前台接好埋点&lt;/h2&gt;&lt;p&gt;做好后：有一份经过测试的接入配置，也有能使用它的网页或母包，供后续建渠道时选用。&lt;/p&gt;&lt;/div&gt;&lt;figure aria-labelledby=&quot;access-map-title&quot; class=&quot;access-map&quot; id=&quot;access-map&quot;&gt;
&lt;figcaption id=&quot;access-map-title&quot;&gt;广告接入分 4 个接入端&lt;/figcaption&gt;
&lt;div aria-label=&quot;广告接入横向树状图，窄屏可左右滚动&quot; class=&quot;access-scroll&quot; role=&quot;region&quot; tabindex=&quot;0&quot;&gt;
&lt;div class=&quot;access-tree&quot;&gt;
&lt;div class=&quot;access-root&quot;&gt;&lt;strong&gt;广告接入&lt;/strong&gt;&lt;span&gt;按接入端分 4 种，一条配置只选一种&lt;/span&gt;&lt;/div&gt; &lt;div class=&quot;access-branches&quot;&gt; &lt;div class=&quot;access-group&quot;&gt; &lt;div class=&quot;access-kind&quot;&gt;&lt;strong&gt;Web&lt;/strong&gt;&lt;span&gt;服务端发&lt;/span&gt;&lt;small&gt;落地页记下点击编号（主站入口同样读取点击编号，交给服务端），5 个事件由服务端确认后发&lt;/small&gt;&lt;/div&gt; &lt;ul class=&quot;access-leaves&quot;&gt;&lt;li&gt;&lt;strong&gt;PC&lt;/strong&gt;&lt;span&gt;电脑浏览器打开&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;H5&lt;/strong&gt;&lt;span&gt;手机浏览器打开&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt; &lt;div class=&quot;access-group&quot;&gt; &lt;div class=&quot;access-kind&quot;&gt;&lt;strong&gt;PWA&lt;/strong&gt;&lt;span&gt;服务端发&lt;/span&gt;&lt;small&gt;桌面启动链接带渠道 code，5 个事件由服务端发&lt;/small&gt;&lt;/div&gt; &lt;ul class=&quot;access-leaves&quot;&gt;&lt;li&gt;&lt;strong&gt;PWA&lt;/strong&gt;&lt;span&gt;装到桌面的网页&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt; &lt;div class=&quot;access-group&quot;&gt; &lt;div class=&quot;access-kind&quot;&gt;&lt;strong&gt;App&lt;/strong&gt;&lt;span&gt;服务端发&lt;/span&gt;&lt;small&gt;App 读出渠道 code 交给服务端，5 个事件由服务端发&lt;/small&gt;&lt;/div&gt; &lt;ul class=&quot;access-leaves&quot;&gt;&lt;li&gt;&lt;strong&gt;安卓原生&lt;/strong&gt;&lt;span&gt;原生安装包&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt; &lt;div class=&quot;access-group&quot;&gt; &lt;div class=&quot;access-kind&quot;&gt;&lt;strong&gt;壳包&lt;/strong&gt;&lt;span&gt;服务端发&lt;/span&gt;&lt;small&gt;壳内网页只把结果交给服务端，由服务端发给广告平台&lt;/small&gt;&lt;/div&gt; &lt;ul class=&quot;access-leaves&quot;&gt;&lt;li&gt;&lt;strong&gt;安卓壳&lt;/strong&gt;&lt;span&gt;壳包安装包&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt; &lt;/div&gt;&lt;/div&gt;&lt;/div&gt; &lt;p class=&quot;access-note&quot;&gt;4 个接入端都一样：前台只负责带上渠道 code 和点击编号，注册、登录、充值发起、充值、首充都由服务端确认成功后发给广告平台；同一次行为只发一次。&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;没拿到点击编号的用户照样发，带 IP 和 UA（Facebook 还带 fbp），由平台自己匹配，同时按渠道统计。&lt;/span&gt;&lt;/p&gt;
&lt;/figure&gt;&lt;div class=&quot;duties&quot;&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;后台 · 运营操作&lt;/span&gt;&lt;h3&gt;广告接入 · 建议新增独立页面&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;填写配置名称，选商户、广告平台、&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;接入端（Web / PWA / App / 壳包，一条只选一种）；不在这里选渠道，配置在「新增渠道」时选，这里只显示被哪个渠道用了&lt;/span&gt;，登记 Pixel ID / Conversion ID。&lt;/li&gt;&lt;li&gt;&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;5 个上报事件由前端、服务端提前写死，商户只看不改；&lt;/span&gt;测试接入；显示测试结果和状态。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;前台 · 用户使用&lt;/span&gt;&lt;h3&gt;装好行为记录工具&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;WEB 接好网页采集工具，能按渠道 code 读取配置；APP 读出安装包里的渠道 code 交给服务端，壳包接通网页与外壳。&lt;/li&gt;&lt;li&gt;真实浏览、启动或业务成功才记录；带上访问编号和版本，同一行为不要被网页、应用重复记录。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;服务端 · 系统处理&lt;/span&gt;&lt;h3&gt;接收记录，发给广告方&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;保存每份接入配置及版本；按渠道提供所需公开配置，接收记录并按选定方式回传，密钥不下发给前台。&lt;/li&gt;&lt;li&gt;Pixel ID 只决定“发到哪里”；用户从哪来，要靠渠道 code 和来源信息另行判断。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;/div&gt;&lt;div class=&quot;accept&quot;&gt;&lt;b&gt;怎么检查&lt;/b&gt;实际打开一次，在我方查到记录，再去广告平台核对。只填好后台配置，还不算接好了。&lt;/div&gt;&lt;div class=&quot;accept&quot; style=&quot;background:#fff3c4&quot;&gt;&lt;b&gt;各平台密钥去哪拿&lt;/b&gt;页面上不放，只写在这里，菜单名用各平台官方英文叫法。填好后在广告接入列表里点「测试」，测试通过再给渠道用。&lt;ul style=&quot;margin:6px 0 0;padding-left:18px&quot;&gt;&lt;li&gt;Facebook：Events Manager › Data sources › 选 Pixel › Settings › Conversions API › Generate access token。填 Pixel ID 和 Access Token。&lt;/li&gt;&lt;li&gt;TikTok：Events Manager › Web Events › 选 Pixel › Settings › Generate Access Token。填 Pixel Code 和 Access Token。&lt;/li&gt;&lt;li&gt;Kwai：先开通 API，再到 Kwai Ads Manager 的 Event Manager 里拿；拿不到就找 Kwai account manager。填 Pixel ID 和 Access Token。（菜单名待以 Kwai 后台为准）&lt;/li&gt;&lt;li&gt;Google Ads：Goals › Conversions › Summary › 选 Conversion Action › Tag setup，AW- 开头的就是 Conversion ID。只填这一项。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;step&quot; id=&quot;step-03&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;03&lt;/span&gt;&lt;div class=&quot;step-intro&quot;&gt;&lt;h2&gt;建渠道，绑定代理&lt;/h2&gt;&lt;p&gt;做好后：每个渠道都能查到对应的端、代理和商户。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;duties&quot;&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;后台 · 运营操作&lt;/span&gt;&lt;h3&gt;渠道管理 · 扩展现有页面&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;商户建渠道，选一个端（PC、H5、PWA、安卓原生、安卓壳）和渠道类型；代理渠道挂一个已有代理（哪个等级都行），非代理渠道不挂；同一代理每次投放、每个端各建一个渠道。&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;建渠道时按链路选推广域名、落地指向、落地页或版面配置、广告接入配置，推广域名自动生成或选独立的；只有一种编号：渠道 code，统计只认它。&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;前台 · 用户使用&lt;/span&gt;&lt;h3&gt;告诉系统从哪里进入&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;网页带上渠道 code，应用带上渠道 code，打开时交给服务端。&lt;/li&gt;&lt;li&gt;前台只提供信息，用户归哪个商户、代理，由服务端核对。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;服务端 · 系统处理&lt;/span&gt;&lt;h3&gt;记住渠道和代理的关系&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;保存渠道、代理、链接和包的对应关系，确认它们属于同一商户。&lt;/li&gt;&lt;li&gt;记录关系何时生效、谁改过；平台不是代理，代理从一级往下发展。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;/div&gt;&lt;div class=&quot;accept&quot;&gt;&lt;b&gt;怎么检查&lt;/b&gt;拿到推广链接或下载的安装包，能查回渠道 code、代理和商户；非代理渠道注册的用户不挂代理。&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;step&quot; id=&quot;step-04&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;04&lt;/span&gt;&lt;div class=&quot;step-intro&quot;&gt;&lt;h2&gt;自动生成推广链接和二维码，检查后发出去&lt;/h2&gt;&lt;p&gt;做好后：投放方拿到可用链接、二维码或下载入口，再到广告平台投放。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;duties&quot;&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;后台 · 运营操作&lt;/span&gt;&lt;h3&gt;渠道管理 · 链接、二维码和安装包&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;渠道保存后，所有渠道都自动生成推广链接和二维码；App 渠道不单独打包，用户下载时系统把渠道号写进母包。&lt;/span&gt;&lt;/li&gt;&lt;li&gt;在渠道列表里复制链接、下载二维码；独立推广域名被封点「换域名」，查看换域名记录。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;前台 · 用户使用&lt;/span&gt;&lt;h3&gt;落地、下载与打开&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;PC、H5 直接打开；PWA 检查安装后打开；应用按确定的方式下载、安装、打开。&lt;/li&gt;&lt;li&gt;跳转时带住已有来源信息；换域名、安装后再打开都要实测，丢了来源就如实标记。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;服务端 · 系统处理&lt;/span&gt;&lt;h3&gt;生成链接和安装包&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;保存推广链接／安装包与渠道、代理、接入配置的对应关系；链接带渠道 code，用户下载时把渠道 code 及所需公开配置写进母包，并记录版本。&lt;/li&gt;&lt;li&gt;保存写入渠道号、检查和分发结果，确保链接指向正确页面或安装包。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;/div&gt;&lt;div class=&quot;accept&quot;&gt;&lt;b&gt;怎么检查&lt;/b&gt;从推广链接或安装包走一遍，进入正确页面或应用、对应正确渠道。点下载不等于已安装，包生成了也不等于已发出。&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;step&quot; id=&quot;step-05&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;05&lt;/span&gt;&lt;div class=&quot;step-intro&quot;&gt;&lt;h2&gt;记录用户进入、注册和充值&lt;/h2&gt;&lt;p&gt;做好后：能查到用户从哪进入、做了什么，以及是否真的成功。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;duties&quot;&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;后台 · 运营操作&lt;/span&gt;&lt;h3&gt;推广报表 · 用户来源 · 事件记录&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;按日期、渠道类型、代理、渠道、广告平台筛选，点数字查用户来源和事件记录。&lt;/li&gt;&lt;li&gt;显示行为发生时间、系统收到时间、来源信息，以及成功、失败或待处理状态。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;前台 · 用户使用&lt;/span&gt;&lt;h3&gt;用户操作时记录&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;真正打开时记访问或启动；落地页读取 URL 里的点击编号，主站入口同样读取点击编号，交给服务端；后续操作带着同一访问编号，注册成功后关联账号。&lt;/li&gt;&lt;li&gt;点注册、充值按钮不算成功；断网后重发同一条记录，继续使用原编号。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;服务端 · 系统处理&lt;/span&gt;&lt;h3&gt;确认是否真的成功&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;账号创建成功才记注册；充值订单确认成功才记充值。&lt;/li&gt;&lt;li&gt;把访问、账号和订单连起来；同一次成功只记一次，异常记录也保留。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;/div&gt;&lt;div class=&quot;events&quot;&gt;&lt;h3&gt;要记录哪些行为（埋点）&lt;/h3&gt;&lt;table class=&quot;event-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;记录什么&lt;/th&gt;&lt;th&gt;由谁、何时确认&lt;/th&gt;&lt;th&gt;怎么使用&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;广告曝光／点击&lt;/td&gt;&lt;td&gt;广告平台记录；用户真正打开我方落地页后，我方才记访问。&lt;/td&gt;&lt;td&gt;有授权再取广告报表，不能拿我方访问冒充广告点击。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;访问／页面浏览&lt;/td&gt;&lt;td&gt;用户真正打开网页时记录。&lt;/td&gt;&lt;td&gt;记住从哪进入、用什么端，以及本次访问编号。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;应用启动&lt;/td&gt;&lt;td&gt;应用真正启动时记录。&lt;/td&gt;&lt;td&gt;记住安装包里写入的渠道号、版本和已知来源；点下载不算启动。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;注册成功&lt;/td&gt;&lt;td&gt;后台确认账号创建成功。&lt;/td&gt;&lt;td&gt;把账号连到之前的访问，核对渠道和代理，再发送平台要求的注册事件。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;充值成功&lt;/td&gt;&lt;td&gt;后台确认充值订单成功。&lt;/td&gt;&lt;td&gt;记住用户、订单、金额和币种，按已确认方案发送购买成功事件。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;提现成功&lt;/td&gt;&lt;td&gt;后台确认提现成功。&lt;/td&gt;&lt;td&gt;本期只记我方数据，不发给广告方。&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p class=&quot;note&quot;&gt;每条记录能查：编号、发生和收到时间、端、推广链接或安装包、访问编号和已知来源。注册后关联用户，产生订单后关联订单；广告事件名称按平台对应，4 个接入端都一样。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;events&quot; style=&quot;background:#fff3c4;padding:14px 16px;border-radius:8px&quot;&gt;&lt;h3&gt;各广告商事件配置（前端、服务端写死，后台只展示）&lt;/h3&gt;&lt;p class=&quot;note&quot; style=&quot;margin-top:0&quot;&gt;前期统一自动上报 5 个事件：注册（CompleteRegistration）、登录（Login）、充值发起（AddToCart）、首充（Subscribe）、充值（Purchase），4 个平台、4 个接入端都一样，全部由我方服务端确认成功后发（各平台的官方事件名见下表）。渠道管理只能选和自己端一致的配置。一份配置只关联一个渠道，不单独填网址或包名，推广域名和安装包都跟着渠道走。提现不发给广告方，只记我方数据。事件名、触发方式和参数由前端、服务端提前写死，总控和商户都不能改；商户在广告接入里只填平台信息、做测试，事件只展示。Google 的 Conversion Action 和 Conversion Label 也由我方提前建好写死，商户只填 Conversion ID。首充：Facebook、TikTok 借用 Subscribe，Kwai 自带 EVENT_FIRST_DEPOSIT，Google 另建一个「首充」PURCHASE 类别的 Conversion Action；同一笔首充也会发一次「充值」。服务端用各平台官方接口：Facebook Conversions API、TikTok Events API、Kwai Events API（名称待确认）、Google Ads Offline conversion import，我方确认成功后才发。参数写法：平台参数=我方取值字段。Kwai 服务端参数名待确认。&lt;/p&gt;&lt;p style=&quot;margin:14px 0 6px&quot;&gt;&lt;b&gt;Facebook&lt;/b&gt;　&lt;a href=&quot;https://developers.facebook.com/docs/meta-pixel/reference&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; style=&quot;color:var(--accent)&quot;&gt;Meta 标准事件文档 ↗&lt;/a&gt;&lt;/p&gt;&lt;table class=&quot;event-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th style=&quot;width:20%&quot;&gt;事件&lt;/th&gt;&lt;th style=&quot;width:18%&quot;&gt;上报的端&lt;/th&gt;&lt;th style=&quot;width:11%&quot;&gt;触发方式&lt;/th&gt;&lt;th style=&quot;width:27%&quot;&gt;user_data&lt;/th&gt;&lt;th style=&quot;width:24%&quot;&gt;custom_data&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;CompleteRegistration&lt;/b&gt;&lt;br&gt;注册&lt;/td&gt;&lt;td&gt;全部端（PC、H5、PWA、安卓原生、安卓壳）&lt;/td&gt;&lt;td&gt;Conversions API&lt;/td&gt;&lt;td&gt;&lt;code style=&quot;font-size:12px&quot;&gt;event_id=记录ID&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;event_time=事件时间&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;action_source=website&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;event_source_url=落地页地址&lt;/code&gt;&lt;br&gt;&lt;code style=&quot;font-size:12px&quot;&gt;fbc=fbc（用落地页记下的 fbclid 拼成）&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;fbp=fbp（落地页生成 fb.1.时间.随机数&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;跳转带到主站）&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;client_ip_address=clientIp&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;client_user_agent=userAgent&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;external_id=sha256(userid)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;--&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Login (custom event)&lt;/b&gt;&lt;br&gt;登录&lt;/td&gt;&lt;td&gt;全部端（PC、H5、PWA、安卓原生、安卓壳）&lt;/td&gt;&lt;td&gt;Conversions API&lt;/td&gt;&lt;td&gt;&lt;code style=&quot;font-size:12px&quot;&gt;event_id=记录ID&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;event_time=事件时间&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;action_source=website&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;event_source_url=落地页地址&lt;/code&gt;&lt;br&gt;&lt;code style=&quot;font-size:12px&quot;&gt;fbc=fbc（用落地页记下的 fbclid 拼成）&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;fbp=fbp（落地页生成 fb.1.时间.随机数&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;跳转带到主站）&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;client_ip_address=clientIp&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;client_user_agent=userAgent&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;external_id=sha256(userid)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;--&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;AddToCart&lt;/b&gt;&lt;br&gt;充值发起&lt;/td&gt;&lt;td&gt;全部端（PC、H5、PWA、安卓原生、安卓壳）&lt;/td&gt;&lt;td&gt;Conversions API&lt;/td&gt;&lt;td&gt;&lt;code style=&quot;font-size:12px&quot;&gt;event_id=记录ID&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;event_time=事件时间&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;action_source=website&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;event_source_url=落地页地址&lt;/code&gt;&lt;br&gt;&lt;code style=&quot;font-size:12px&quot;&gt;fbc=fbc（用落地页记下的 fbclid 拼成）&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;fbp=fbp（落地页生成 fb.1.时间.随机数&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;跳转带到主站）&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;client_ip_address=clientIp&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;client_user_agent=userAgent&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;external_id=sha256(userid)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code style=&quot;font-size:12px&quot;&gt;value=depositAmount&lt;/code&gt; &l 、PWA、安卓原生、安卓壳）&lt;/td&gt;&lt;td&gt;Offline conversion import&lt;/td&gt;&lt;td&gt;&lt;code style=&quot;font-size:12px&quot;&gt;conversion_action=我方建好的 Conversion Action&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;conversion_date_time=事件时间&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;gclid=gclid（落地页记下的）&lt;/code&gt;&lt;/td&gt;&lt;td&gt;--&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;DEFAULT (Login)&lt;/b&gt;&lt;br&gt;登录&lt;/td&gt;&lt;td&gt;全部端（PC、H5、PWA、安卓原生、安卓壳）&lt;/td&gt;&lt;td&gt;Offline conversion import&lt;/td&gt;&lt;td&gt;&lt;code style=&quot;font-size:12px&quot;&gt;conversion_action=我方建好的 Conversion Action&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;conversion_date_time=事件时间&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;gclid=gclid（落地页记下的）&lt;/code&gt;&lt;/td&gt;&lt;td&gt;--&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;ADD_TO_CART&lt;/b&gt;&lt;br&gt;充值发起&lt;/td&gt;&lt;td&gt;全部端（PC、H5、PWA、安卓原生、安卓壳）&lt;/td&gt;&lt;td&gt;Offline conversion import&lt;/td&gt;&lt;td&gt;&lt;code style=&quot;font-size:12px&quot;&gt;conversion_action=我方建好的 Conversion Action&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;conversion_date_time=事件时间&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;gclid=gclid（落地页记下的）&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code style=&quot;font-size:12px&quot;&gt;conversion_value=depositAmount&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;currency_code=商户币种（daman 为 INR）&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;order_id=orderId&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;PURCHASE&lt;/b&gt;&lt;br&gt;充值&lt;/td&gt;&lt;td&gt;全部端（PC、H5、PWA、安卓原生、安卓壳）&lt;/td&gt;&lt;td&gt;Offline conversion import&lt;/td&gt;&lt;td&gt;&lt;code style=&quot;font-size:12px&quot;&gt;conversion_action=我方建好的 Conversion Action&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;conversion_date_time=事件时间&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;gclid=gclid（落地页记下的）&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code style=&quot;font-size:12px&quot;&gt;conversion_value=orderAmount&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;currency_code=商户币种（daman 为 INR）&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;order_id=orderId&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;PURCHASE (first_deposit)&lt;/b&gt;&lt;br&gt;首充&lt;/td&gt;&lt;td&gt;全部端（PC、H5、PWA、安卓原生、安卓壳）&lt;/td&gt;&lt;td&gt;Offline conversion import&lt;/td&gt;&lt;td&gt;&lt;code style=&quot;font-size:12px&quot;&gt;conversion_action=我方建好的 Conversion Action&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;conversion_date_time=事件时间&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;gclid=gclid（落地页记下的）&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code style=&quot;font-size:12px&quot;&gt;conversion_value=orderAmount&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;currency_code=商户币种（daman 为 INR）&lt;/code&gt; &lt;code style=&quot;font-size:12px&quot;&gt;order_id=orderId&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;accept&quot;&gt;&lt;b&gt;怎么检查&lt;/b&gt;同一条注册成功记录发多次，注册人数仍只加 1；充值失败或处理中，不算充值成功。&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;step&quot; id=&quot;step-06&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;06&lt;/span&gt;&lt;div class=&quot;step-intro&quot;&gt;&lt;h2&gt;确认渠道和代理，再给广告方发事件&lt;/h2&gt;&lt;p&gt;做好后：我方留真实记录；广告方另收一份，用于匹配广告效果。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;duties&quot;&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;后台 · 运营操作&lt;/span&gt;&lt;h3&gt;渠道管理；推广报表 · 事件记录&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;查看用户对应的商户、渠道、代理；来源不明或互相冲突的记录单独查看。&lt;/li&gt;&lt;li&gt;打开事件记录，看是否发出、失败原因、重试结果；对方收到，不代表已匹配到广告。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;前台 · 用户使用&lt;/span&gt;&lt;h3&gt;一路带着来源信息&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;继续传递拿得到的来源信息、访问编号和广告点击编号。&lt;/li&gt;&lt;li&gt;新用户从绑定了代理的渠道注册，无需再填邀请码；老用户换渠道，不自动更换上级。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;服务端 · 系统处理&lt;/span&gt;&lt;h3&gt;核对归属，发送事件&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;核对推广链接或安装包，确认渠道和代理；广告来源、邀请代理分别保存。&lt;/li&gt;&lt;li&gt;按平台要求发事件，避免重复；来源不明就保留未知，&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;没拿到点击编号也照样发，带 IP 和 UA（Facebook 还带 fbp），由平台自己匹配&lt;/span&gt;；发送失败也不影响我方记录。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;/div&gt;&lt;div class=&quot;endpoints&quot;&gt;&lt;div&gt;&lt;b&gt;我方归属&lt;/b&gt;推广链接／安装包 → 渠道和代理 → 用户。保存当时的关系，用来统计我方报表。&lt;/div&gt;&lt;div&gt;&lt;b&gt;广告归因&lt;/b&gt;把真实行为和已知来源（点击编号，没有就只带 IP、UA）发给广告平台，由平台判断对应哪条广告；并非每条都能匹配成功。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;accept&quot;&gt;&lt;b&gt;怎么检查&lt;/b&gt;用户可以既“来自 Facebook”，又“属于代理 8810021”。广告来源不明，不影响已知代理，也不能直接当自然流量。&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;step&quot; id=&quot;step-07&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;07&lt;/span&gt;&lt;div class=&quot;step-intro&quot;&gt;&lt;h2&gt;在商户和集团报表里看到结果&lt;/h2&gt;&lt;p&gt;做好后：查到各渠道的真实效果；拿到广告报表授权后，再对照双方数据。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;duties&quot;&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;后台 · 运营操作&lt;/span&gt;&lt;h3&gt;推广报表 · 建议新增&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;商户按日期、渠道类型、代理、渠道、广告平台筛选：新增报表看落地页浏览、点按钮数、注册、首充、充值；留存报表看各渠道次日到 30 日留存、7 日首充率、7 日人均充值；点击数字能看明细。&lt;/li&gt;&lt;li&gt;总控在“推广报表”的汇总统计中，按已授权范围看集团、商户数据；广告曝光、点击等另列，标明来源、时区和更新时间。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;前台 · 用户使用&lt;/span&gt;&lt;h3&gt;配合核对真实操作&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;持续准确记录行为和版本；最终人数由服务端统计，前台不能生成广告曝光、点击数据。&lt;/li&gt;&lt;li&gt;联调时实际打开推广链接、注册账号，方便前后核对同一个用户。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;服务端 · 系统处理&lt;/span&gt;&lt;h3&gt;统计我方数据，对照广告报表&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;用我方确认的记录统计，人数、次数、金额分开；同一个用户不能因查看角度不同重复计入总数。&lt;/li&gt;&lt;li&gt;有授权再取广告报表，保留更正记录；没拿到数据显示“未获取”，不能填 0，也不能硬分给代理。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;/div&gt;&lt;div class=&quot;accept&quot;&gt;&lt;b&gt;怎么检查&lt;/b&gt;渠道 A1、代理 8810021、所属商户都能查到这位新用户，但商户总人数只加 1；广告回传失败也不影响查看。&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;step&quot; id=&quot;step-08&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;08&lt;/span&gt;&lt;div class=&quot;step-intro&quot;&gt;&lt;h2&gt;上线后，能更新，也能查问题&lt;/h2&gt;&lt;p&gt;做好后：总控提供可用版本并维护，商户安排渠道更新，系统能查到用户实际用的版本和异常原因。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;duties&quot;&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;后台 · 运营操作&lt;/span&gt;&lt;h3&gt;应用与版本 · 总控维护，商户直接用&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;总控在“应用与版本”中维护母包，切到「版本」页签完成验证，写清更新内容、适用商户和更新方式。&lt;/li&gt;&lt;li&gt;&lt;span style=&quot;background:#fff3c4;border-radius:3px;padding:0 3px&quot;&gt;PWA 由商户在落地页「仿商城」里改好后保存；新内容先在后台准备好（预加载）再一次切换，切换时不白屏（待开发确认）。&lt;/span&gt;&lt;/li&gt;&lt;li&gt;商户在“应用与版本”的版本更新中选择可用版本，确定更新哪些 App 渠道，查看升级进度。&lt;/li&gt;&lt;li&gt;同页「版本」里点各版本的「问题」处理母包缺陷和更新故障；商户查看受影响渠道和用户，跟进修复结果。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;前台 · 用户使用&lt;/span&gt;&lt;h3&gt;检查和执行更新&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;上报当前实际使用的版本；按支持的方式检查、下载、提示或执行更新。&lt;/li&gt;&lt;li&gt;PWA、壳内页面热更、安装包升级分别处理；失败如实记录，强制更新不等于自动安装。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;article class=&quot;duty&quot;&gt;&lt;span class=&quot;role&quot;&gt;服务端 · 系统处理&lt;/span&gt;&lt;h3&gt;保存版本和处理记录&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;保存各版本的配套关系、发布和更新结果；历史记录保留当时的版本和归属。&lt;/li&gt;&lt;li&gt;记录各商户、渠道和用户实际使用的版本，支持查错与重试；配置变化不直接改写历史，故障恢复方式需按更新类型验证。&lt;/li&gt;&lt;/ul&gt;&lt;/article&gt;&lt;/div&gt;&lt;div class=&quot;accept version-handoff&quot;&gt;&lt;b&gt;版本怎样交到用户手里&lt;/b&gt;总控验证并发布可用版本 → 商户选择 App 渠道 → 按类型热更或发新版母包、验证、分发 → 用户实际更新 → 回报运行版本。&lt;p&gt;总控发布母包，不会自动改掉用户手机里的旧包。总控能否直接强更、是否需要商户确认，仍待确定。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;accept&quot;&gt;&lt;b&gt;怎么检查&lt;/b&gt;发布新版母包后，没升级的用户仍显示旧版本；出了问题能查到对应渠道、任务、行为或版本。&lt;/div&gt;&lt;/section&gt;&lt;/main&gt;&lt;section class=&quot;decision&quot;&gt;&lt;h2&gt;开工前，还要定清这 4 类规则&lt;/h2&gt;&lt;div class=&quot;decision-grid&quot;&gt;&lt;p&gt;&lt;b&gt;归属与统计&lt;/b&gt;邀请码与渠道不一致时归谁；多久前的广告算来源；同一人跨端怎么算；每天按哪个时区统计。&lt;/p&gt;&lt;p&gt;&lt;b&gt;权限与启停&lt;/b&gt;总控是否需要代商户配置、停用或重试；谁能发包、导出；集团、代理能看哪些明细；停用和配置更换如何影响已发链接、旧包。&lt;/p&gt;&lt;p&gt;&lt;b&gt;资金口径&lt;/b&gt;不同币种怎么汇总。返佣结算不在本轮制定。&lt;/p&gt;&lt;p&gt;&lt;b&gt;接入、分发与更新&lt;/b&gt;安装包从哪下载；哪些内容能热更、更新失败怎么办；总控能否直接要求商户强更，还是需要商户确认后执行。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;delivery&quot;&gt;&lt;h2&gt;建议先做 H5，把注册 +1 跑通&lt;/h2&gt;&lt;p&gt;准备域名 → 装好记录工具 → 建渠道、绑代理 → 生成推广链接 → 用户注册 → 我方保存、广告方另收 → 渠道报表 +1。&lt;/p&gt;&lt;p&gt;&lt;small&gt;前台、后台、服务端一起配合，用真实操作核对结果。只有表单或模拟数字不算做好；跑通后再扩展应用分包、其他平台和更新。&lt;/small&gt;&lt;/p&gt;&lt;/section&gt;&lt;footer&gt;当前是方案，前台和 V3 实际页面尚未修改；开工前需确认上述规则和要改的页面。&lt;/footer&gt;&lt;/div&gt;&lt;script&gt;document.getElementById(&#x27;print&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;window.print());&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe></section>

<script>
var LAYS=['1050首页版面','1050节日版面','1050世界杯版面'],DLAY=LAYS[0];

const $=s=>document.querySelector(s);
const B=(t,c='')=>`<span class="bd ${c}">${t}</span>`;
const st=(t,k)=>`<span class="st ${k}">${t}</span>`;
const pill=t=>`<span class="pill">${t}</span>`;
const tags=a=>a.map(x=>`<span class="tag">${x}</span>`).join('');
const M='(1050)daman';
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',1800)}
function inp(label,val,opt={}){return `<div class="fi ${opt.cls||''}"><label>${label}${opt.req?'<i> *</i>':''}${hi(label)}</label>${opt.t?`<input class="inp" value="${val||''}" placeholder="${opt.ph||'请输入'}" style="${opt.w?'min-width:'+opt.w+'px':''}">`:`<div class="inp ${val?'v':''}" data-l="${label}" style="${opt.w?'min-width:'+opt.w+'px':''}">${val||opt.ph||'请选择'}</div>`}</div>`}
function flt(items,extra=''){return `<div class="flt">${items.join('')}<div class="btns">${extra}<button class="btn p">⌕ 搜索</button><button class="btn">↻ 重置</button></div></div>`}
function table(cols,rows,opt={}){
  const th=cols.map(c=>`<th class="${c.cls||''}">${c.t}${hi(c.t)}</th>`).join('');
  const tr=rows.map(r=>`<tr class="${r._cls||''}">${cols.map(c=>`<td class="${c.cls||''} ${c.l?'l':''}">${typeof c.k==='function'?c.k(r):(r[c.k]??'--')}</td>`).join('')}</tr>`).join('');
  return `<div class="tw"><table>${'<thead><tr>'+th+'</tr></thead>'}<tbody>${tr}</tbody></table></div><div class="foot">共 ${opt.total??rows.length} 条 <span class="pg">1</span> <span>20 / 页</span></div>`}
function tabs(list,cur,fn){return `<div class="ptabs">${list.map((x,i)=>`<span class="${i===cur?'on':''}" onclick="${fn}(${i})">${x}</span>`).join('')}</div>`}
function chg(kind,text){const k={new:B('新增页面'),chg:B('改动页面','c'),keep:B('沿用 + 小改','c')}[kind];return `<div class="chg">${k}<span>${text}</span></div>`}
const OKF0='<button class="btn" onclick="closeDrawer()">取消</button><button class="btn p" onclick="closeDrawer();toast(\'演示：已保存\')">确定</button>';
const CLOSEF='<button class="btn" onclick="closeDrawer()">关闭</button>';
const OKF='<button class="btn" onclick="closeDrawer()">取消</button><button class="btn p" onclick="closeDrawer();toast(\'已保存\')">确定</button>';
/* 弹窗：宽度只用 440/520/600/720/860；标题带信息按「标题 | 标签：值」 */
function openDrawer(title,body,foot,w=600,kv){const t=title+(kv?'<i class="vl"></i>'+kv.map(([k,v])=>`<span class="kv"><span>${k}：</span><b>${v||'--'}</b></span>`).join(''):'');
 $('#dtitle').innerHTML=t+'<span class="x" onclick="closeDrawer()">✕</span>';$('#dbody').innerHTML=body;$('#dfoot').innerHTML=foot??OKF;const m=$('#modal');m.style.setProperty('--w',w+'px');$('#mask').classList.add('on');m.classList.add('on')}
function closeDrawer(){$('#mask').classList.remove('on');$('#modal').classList.remove('on')}
/* 统一「?」：只给改名后仍需解释的字段加，说明集中在 TIPS */
const TIPS={
 '触发方式':'5 个事件都由我方服务端确认成功后发，用各平台官方接口：Facebook Conversions API、TikTok Events API、Kwai Events API（名称待确认）、Google Ads Offline conversion import；我方确认成功后再发，Access Token 不下发前台。',
 '服务器参数':'服务端发事件时带上的用户标识，用来让平台匹配到广告点击。等号右边是我方系统里的取值字段。',
 '自定义参数':'随事件一起发的业务数据，比如金额、币种。等号右边是我方系统里的取值字段。',
 'Test Event Code':'平台后台「Test Events」页给的一串码（如 TEST12345，Facebook、TikTok、Kwai 都有）。带上它发出的事件只显示在 Test Events 页，不计入正式数据。只在测试时用，不保存。',
 '平台接口返回':'平台接口对这次发送的回复：已接收，或具体报错原因。不代表已经算到广告上。',
 '分流权重':'有多个跳转域名时，按权重分配访问量。比如 60 和 40，就是六成和四成；填 0 不分流量。',
 '评分':'安装页上显示的星级，例如 4.8，只用于展示。',
 '网页推送证书':'推送服务给的网页推送证书（原「web证书」），用来给装了 PWA 的用户发消息。',
 '推送 SDK 代码':'推送服务提供的一段接入代码（原「SDK代码」），发布后安装页会自动加载。',
 '桌面快捷方式图标':'用户添加到桌面后，桌面上显示的图标（原「logo上传-快捷方式」）。',
 '应用图标':'安装页顶部显示的图标（原「logo上传」）。',
 '当前内容版本':'这个域名的 PWA 现在用的内容版本。总控发布了新内容后，这里会出现推送按钮，点了才会换到新内容。',
 'PWA':'PWA 就是能「添加到桌面」的网页，装好后像应用一样从桌面打开，不用下载安装包。落地页「仿商城」就是 PWA 安装页，桌面名称、图标、启动图、推送都在那里配（原来域名管理里的 PWA 设置并到这里）。',
 '装到桌面数':'用户把网页添加到手机桌面（PWA）的次数。',
 '从桌面打开数':'用户从桌面图标打开 PWA 的次数。',
 '平台接入ID':'在广告平台后台拿到的编号，如 Facebook 的 Pixel ID、TikTok 的 Pixel Code、Google 的 Conversion ID。填错了数据就发不到这个平台。',
 'Access Token':'用来把注册、充值结果发给广告平台。只存在服务端，不会出现在网页或安装包里。',
 '归属代理':'填代理 ID。从这个渠道注册的新用户，自动成为这个代理的下级，不用再填邀请码。老用户不会改上级。',
 '母包':'总控统一做好的安装包，每个端只有一个。新建 App 渠道时按端自动带出；用户从哪个渠道下载，系统就把那个渠道号写进去，不重新打包。',
 '母包名称':'总控统一做好的安装包，每个端只有一个。用户从哪个渠道下载，系统就把那个渠道号写进去，不重新打包。',
 '更新方式':'打开时自动更新：用户不用重装，打开应用就换成新版本。提示下载新包：用户要下载安装新的安装包。',
 
 
 '渠道 code':'系统给每个渠道生成的唯一编号。推广链接都带它，用户注册时写到用户身上，之后的充值、首充都按它统计。',
 '渠道类型':'只分两种。代理渠道：挂一个代理，代理是哪个等级都行，相当于这个代理的分享，从这个渠道注册的用户都算这个代理的下级。非代理渠道：不挂代理。',
 '落地指向':'用户点广告后先到哪：落地页（落地页管理里做的页面）、主站首页、主站注册页。选主站首页或注册页时，可以单独选一套版面配置，默认用主域名绑的那套。',
 '落地页浏览':'打开落地页的次数。只有落地指向选了「落地页」的渠道才有。',
 '点按钮数':'在落地页上点按钮的次数：网页渠道是进网站，PWA 是加到桌面，App 是下载。',
 '端':'PC、H5（手机浏览器）、PWA（装到桌面的网页）、安卓原生、安卓壳。一个渠道只对应一个端。',
 '推广链接':'自动子域名直接是 https://渠道code.推广泛域名；独立推广域名是 域名 /?code=渠道 code。两种都带渠道 code，统计只认它。',
 '落地页':'用户点广告后先到的页面（仿商城或一图流），在「落地页管理」里做。同一个落地页可以给多个渠道用。',
 '推广域名':'渠道的入口域名，链接带渠道 code。默认自动生成子域名（渠道 code.推广泛域名），也可以选独立推广域名。一对一：一个渠道一个，一个只属于一个渠道。',
 '跳转域名':'落地页按钮（或落地指向选主站时的推广链接）去主站、去下载时经过的中转域名。公共池，多个渠道共用，被封时池里其他域名接着用。跳转全程带着渠道 code，不影响统计。不选就用默认池。',
 '防封下载页':'主站或推广域名被封后的救援页。已装 PWA / App 的用户打开时，系统弹出救援弹窗，让用户复制链接到浏览器打开这个页面，重新下载 PWA 或 App，再用原账号登录。公共池，不选就用默认。只对 PWA、App 渠道有用，PC、H5 渠道不显示。',
 '域名类型':'主域名：主站。推广域名：渠道入口，一对一。跳转域名、防封下载页：公共池，多个渠道共用。下载域名：放母包。',
 '页面路径':'这个落地页的预览地址后缀，如 reg500，只用来预览和区分页面，不出现在推广链接里。同一商户下不能重复。',
